<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>試算工具合集</title>
<style>
:root{--bar:#13284b;--ink:#f2ead6;--muted:#9fb0cc;--gold:#c9a24e;--bg:#f3f5f9;--h:62px}
@media (prefers-color-scheme:dark){:root{--bar:#0d1830;--bg:#0a1324}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#stage{position:fixed;inset:0 0 calc(var(--h) + env(safe-area-inset-bottom,0px)) 0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#stage iframe.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bar);border-top:2px solid var(--gold);display:grid;grid-template-columns:repeat(4,1fr);
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;z-index:10}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:0 4px}
nav button small{font-size:10px;letter-spacing:.12em;opacity:.7;font-weight:400}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"]::before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
@media print{nav{display:none}#stage{inset:0}}
</style>
</head>
<body>
<div id="stage"></div>
<nav role="tablist" aria-label="切換試算工具" id="tabs"></nav>
<script>
const TOOLS=[{"key": "prem", "label": "保費融資", "full": "保費融資", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>保費融資 · 匯率情境試算<\/title>\n<style>\n  :root{\n    --navy:#16233f;\n    --navy-2:#1e3050;\n    --ink:#20293b;\n    --gold:#bd9a44;\n    --gold-soft:#e7d9ad;\n    --green:#1a6a52;\n    --green-soft:#d6e7de;\n    --amber:#c9902c;\n    --amber-soft:#f3e4c4;\n    --rust:#9f4130;\n    --rust-soft:#eed4cc;\n    --peri:#7f86ad;\n    --peri-soft:#dfe1ee;\n    --ivory:#f6f2e9;\n    --paper:#ffffff;\n    --line:#e4ddcd;\n    --muted:#6c7385;\n    --display:\"Noto Serif TC\",\"Songti TC\",\"Source Han Serif TC\",\"Georgia\",serif;\n    --body:\"PingFang TC\",\"Noto Sans TC\",\"Microsoft JhengHei\",system-ui,sans-serif;\n    --num:\"SF Mono\",ui-monospace,\"Roboto Mono\",\"Menlo\",monospace;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    font-family:var(--body);\n    color:var(--ink);\n    background:var(--ivory);\n    line-height:1.55;\n    -webkit-font-smoothing:antialiased;\n  }\n  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 60px;}\n\n  /* ---- Header ---- */\n  .masthead{\n    background:\n      linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);\n    color:#f4efe2;\n    border-radius:6px;\n    padding:26px 30px;\n    position:relative;\n    overflow:hidden;\n    box-shadow:0 10px 30px rgba(22,35,63,.18);\n  }\n  .masthead::after{\n    content:\"\";position:absolute;right:-40px;top:-40px;width:220px;height:220px;\n    border:1px solid rgba(189,154,68,.35);border-radius:50%;\n  }\n  .masthead::before{\n    content:\"\";position:absolute;right:14px;top:14px;bottom:14px;width:5px;\n    background:var(--gold);border-radius:3px;\n  }\n  .eyebrow{\n    font-size:12px;letter-spacing:.32em;color:var(--gold-soft);\n    text-transform:uppercase;margin:0 0 8px;font-weight:600;\n  }\n  .masthead h1{\n    font-family:var(--display);font-weight:700;\n    font-size:27px;margin:0;letter-spacing:.02em;line-height:1.25;\n  }\n  .masthead .sub{margin:9px 0 0;font-size:13.5px;color:#cfd6e6;max-width:640px;}\n  .spot{\n    margin-top:14px;display:inline-flex;align-items:baseline;gap:8px;\n    background:rgba(189,154,68,.14);border:1px solid rgba(189,154,68,.4);\n    padding:5px 12px;border-radius:20px;font-size:12.5px;color:var(--gold-soft);\n  }\n  .spot b{font-family:var(--num);color:#fff;font-size:13.5px;}\n\n  /* ---- Section frame ---- */\n  .card{\n    background:var(--paper);border:1px solid var(--line);border-radius:6px;\n    padding:20px 22px;margin-top:18px;box-shadow:0 2px 10px rgba(22,35,63,.04);\n  }\n  .card > h2{\n    font-family:var(--display);font-size:16.5px;margin:0 0 4px;color:var(--navy);\n    display:flex;align-items:center;gap:10px;\n  }\n  .card > h2::before{content:\"\";width:16px;height:2px;background:var(--gold);display:inline-block;}\n  .card > .hint{font-size:12.5px;color:var(--muted);margin:0 0 16px;}\n\n  /* ---- Inputs ---- */\n  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;}\n  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}\n  .field .inp{position:relative;}\n  .field input[type=number]{\n    width:100%;font-family:var(--num);font-size:15px;color:var(--ink);\n    padding:9px 40px 9px 11px;border:1px solid var(--line);border-radius:5px;\n    background:#fcfbf7;transition:border-color .15s,box-shadow .15s;\n  }\n  .field input[type=number]:focus{\n    outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(189,154,68,.15);\n    background:#fff;\n  }\n  .field .unit{\n    position:absolute;right:11px;top:50%;transform:translateY(-50%);\n    font-size:12px;color:var(--muted);pointer-events:none;\n  }\n  .derived{\n    grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:2px;\n  }\n  .chip{\n    background:var(--ivory);border:1px solid var(--line);border-radius:5px;\n    padding:8px 13px;font-size:12.5px;color:var(--muted);\n  }\n  .chip b{font-family:var(--num);color:var(--navy);font-size:14px;margin-left:6px;}\n  .toolbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}\n  .btn{\n    font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;\n    border-radius:5px;padding:9px 16px;border:1px solid var(--navy);\n    background:var(--navy);color:#fff;transition:opacity .15s,transform .05s;\n  }\n  .btn:hover{opacity:.9;}\n  .btn:active{transform:translateY(1px);}\n  .btn.ghost{background:#fff;color:var(--navy);}\n  .btn.gold{background:var(--gold);border-color:var(--gold);color:#231c07;}\n\n  /* ---- Scenario slider ---- */\n  .fx-live{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:20px;}\n  .fx-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;}\n  .fx-read{font-size:13px;color:var(--muted);}\n  .fx-read b{font-family:var(--num);font-size:22px;color:var(--navy);}\n  .fx-move{font-family:var(--num);font-size:13px;font-weight:600;padding:2px 9px;border-radius:14px;}\n  input[type=range]{\n    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;\n    background:linear-gradient(90deg,var(--green) 0%,var(--gold) 50%,var(--rust) 100%);\n    margin:14px 0 4px;\n  }\n  input[type=range]::-webkit-slider-thumb{\n    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;\n    background:#fff;border:3px solid var(--navy);cursor:pointer;\n    box-shadow:0 2px 6px rgba(0,0,0,.2);margin-top:0;\n  }\n  input[type=range]::-moz-range-thumb{\n    width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--navy);cursor:pointer;\n  }\n  .rail-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--num);}\n\n  /* ---- Two waterfalls ---- */\n  .falls{display:grid;grid-template-columns:1fr 1fr;gap:16px;}\n  .fall{border:1px solid var(--line);border-radius:6px;padding:16px 14px 12px;background:#fdfcf9;}\n  .fall h3{\n    font-family:var(--display);font-size:14px;margin:0 0 2px;color:var(--navy);\n    display:flex;justify-content:space-between;align-items:baseline;\n  }\n  .fall h3 .rate{font-family:var(--num);font-size:20px;font-weight:700;}\n  .fall .yr{font-size:11.5px;color:var(--muted);margin-bottom:14px;}\n  .chart{display:flex;align-items:flex-end;gap:10px;height:172px;padding-top:18px;}\n  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}\n  .bar{width:100%;border-radius:3px 3px 0 0;position:relative;transition:height .35s ease,margin .35s ease;}\n  .bar .val{\n    position:absolute;top:-16px;left:50%;transform:translateX(-50%);\n    font-family:var(--num);font-size:10.5px;color:var(--ink);white-space:nowrap;font-weight:600;\n  }\n  .bar.sv{background:var(--gold);}\n  .bar.ded{background:var(--peri);}\n  .bar.net{background:var(--green);}\n  .spacer{width:100%;background:transparent;transition:height .35s ease;}\n  .col .cap{font-size:10.5px;color:var(--muted);margin-top:7px;text-align:center;line-height:1.3;}\n  .fall .summary{\n    display:flex;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);\n    font-size:12px;\n  }\n  .fall .summary .k{color:var(--muted);}\n  .fall .summary .v{font-family:var(--num);font-weight:700;font-size:14px;}\n\n  /* ---- Scenario table ---- */\n  table{width:100%;border-collapse:collapse;font-size:13px;}\n  thead th{\n    background:var(--navy);color:#f1ecdf;font-weight:600;font-size:12px;\n    padding:9px 10px;text-align:right;letter-spacing:.02em;\n  }\n  thead th:first-child{text-align:left;border-radius:5px 0 0 0;}\n  thead th:last-child{border-radius:0 5px 0 0;}\n  tbody td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--num);}\n  tbody td:first-child{text-align:left;font-family:var(--body);color:var(--ink);font-weight:600;}\n  tbody tr.base{background:var(--ivory);}\n  tbody tr.base td:first-child::after{content:\" · 基準\";color:var(--gold);font-weight:700;font-size:11px;}\n  .tag{display:inline-block;min-width:70px;padding:3px 8px;border-radius:4px;font-weight:700;}\n  .g{background:var(--green-soft);color:var(--green);}\n  .a{background:var(--amber-soft);color:var(--amber);}\n  .r{background:var(--rust-soft);color:var(--rust);}\n  .legend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;}\n  .legend span{display:inline-flex;align-items:center;gap:6px;}\n  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}\n\n  /* ---- Breakeven ---- */\n  .be-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}\n  .be{\n    border:1px solid var(--line);border-radius:6px;padding:16px 18px;\n    background:linear-gradient(180deg,#fff, #fbf8f1);\n  }\n  .be .lab{font-size:12.5px;color:var(--muted);}\n  .be .rate{font-family:var(--num);font-size:26px;font-weight:700;color:var(--rust);margin:4px 0;}\n  .be .note{font-size:12px;color:var(--ink);}\n  .be .note b{color:var(--navy);font-family:var(--num);}\n\n  .foot{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.7;}\n  .foot b{color:var(--ink);}\n\n  @media (max-width:720px){\n    .grid{grid-template-columns:1fr 1fr;}\n    .falls{grid-template-columns:1fr;}\n    .be-grid{grid-template-columns:1fr;}\n    .masthead h1{font-size:22px;}\n    .wrap{padding:18px 14px 48px;}\n  }\n  @media (max-width:460px){\n    .grid{grid-template-columns:1fr;}\n  }\n\n  /* ---- Print (A4) ---- */\n  @media print{\n    body{background:#fff;}\n    .wrap{max-width:none;padding:0;}\n    .toolbar,.fx-note{display:none !important;}\n    .card,.masthead{box-shadow:none;break-inside:avoid;}\n    .masthead{border:1px solid var(--navy);}\n    input[type=range]{display:none;}\n    @page{size:A4;margin:12mm;}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <header class=\"masthead\">\n    <p class=\"eyebrow\">亞灣專屬 · 保費融資<\/p>\n    <h1>放大資產效能:保費融資策略試算<\/h1>\n    <p class=\"sub\">調整保費、自備款、10/20 年解約金與匯率,即時重算年化報酬、匯率情境與損益兩平。保單美元計價、借款台幣計息——請留意幣別錯配對報酬的放大效果。<\/p>\n    <div class=\"spot\">採用匯率 USD/TWD　<b id=\"spotBase\">32.30<\/b><\/div>\n  <\/header>\n\n  <!-- INPUTS -->\n  <section class=\"card\">\n    <h2>試算條件<\/h2>\n    <p class=\"hint\">預設值還原你簡報的基準情境;修改任一欄位下方全部即時重算。<\/p>\n    <div class=\"grid\">\n      <div class=\"field\">\n        <label>總保費<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"premium\" value=\"2000000\" step=\"10000\"><span class=\"unit\">元<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label>自備款比例<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"dpRate\" value=\"40\" step=\"5\" min=\"0\" max=\"100\"><span class=\"unit\">%<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label>融資年利率<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"loanRate\" value=\"2\" step=\"0.1\"><span class=\"unit\">%<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label>期初 / 目前匯率 (USD→TWD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"baseRate\" value=\"32.30\" step=\"0.01\"><span class=\"unit\">元<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label>第 10 年解約金 <span style=\"font-weight:400\">(期初匯率下)<\/span><\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"sv10\" value=\"3085504\" step=\"1000\"><span class=\"unit\">元<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label>第 20 年解約金 <span style=\"font-weight:400\">(期初匯率下)<\/span><\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"sv20\" value=\"4834789\" step=\"1000\"><span class=\"unit\">元<\/span><\/div>\n      <\/div>\n      <div class=\"derived\">\n        <div class=\"chip\">自備款(投入本金)<b id=\"d-dp\"><\/b><\/div>\n        <div class=\"chip\">銀行融資本金<b id=\"d-loan\"><\/b><\/div>\n        <div class=\"chip\">每年利息<b id=\"d-int\"><\/b><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"toolbar\">\n      <button class=\"btn ghost\" id=\"btnReset\">還原簡報預設<\/button>\n      <button class=\"btn gold\" id=\"btnPrint\">列印 / 匯出 PDF<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- LIVE SCENARIO -->\n  <section class=\"card\">\n    <h2>期末匯率情境 · 財務表現<\/h2>\n    <p class=\"hint\">拖曳下方匯率軸,觀察解約金重估後兩期的期末淨值與年化報酬。台幣升值 → 美元資產換回台幣減少、負債不變,報酬遭槓桿放大侵蝕。<\/p>\n\n    <div class=\"fx-live\">\n      <div class=\"fx-head\">\n        <div class=\"fx-read\">假設期末匯率　<b id=\"fxVal\">32.30<\/b>　<span id=\"fxRel\"><\/span><\/div>\n        <div class=\"fx-move\" id=\"fxMove\"><\/div>\n      <\/div>\n      <input type=\"range\" id=\"fxSlider\" min=\"23\" max=\"40\" step=\"0.01\" value=\"32.30\">\n      <div class=\"rail-labels\"><span>23.00 (台幣強)<\/span><span>32.30 (期初)<\/span><span>40.00 (台幣弱)<\/span><\/div>\n    <\/div>\n\n    <div class=\"falls\">\n      <div class=\"fall\" id=\"fall10\"><\/div>\n      <div class=\"fall\" id=\"fall20\"><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- SCENARIO TABLE -->\n  <section class=\"card\">\n    <h2>匯率情境矩陣<\/h2>\n    <p class=\"hint\">以期初匯率為基準,台幣升值 / 貶值各 5%~20% 對單利年化報酬的影響。<\/p>\n    <table>\n      <thead>\n        <tr><th>情境<\/th><th>期末匯率<\/th><th>10 年單利年化<\/th><th>20 年單利年化<\/th><\/tr>\n      <\/thead>\n      <tbody id=\"scenBody\"><\/tbody>\n    <\/table>\n    <div class=\"legend\">\n      <span><i class=\"dot\" style=\"background:var(--green)\"><\/i>穩健 ≥ 5%<\/span>\n      <span><i class=\"dot\" style=\"background:var(--amber)\"><\/i>邊際 0–5%<\/span>\n      <span><i class=\"dot\" style=\"background:var(--rust)\"><\/i>虧損 &lt; 0%<\/span>\n    <\/div>\n  <\/section>\n\n  <!-- BREAKEVEN -->\n  <section class=\"card\">\n    <h2>損益兩平匯率<\/h2>\n    <p class=\"hint\">自有資金(自備款)報酬歸零時的期末匯率——台幣需升值至此以上才會侵蝕本金。<\/p>\n    <div class=\"be-grid\">\n      <div class=\"be\" id=\"be10\"><\/div>\n      <div class=\"be\" id=\"be20\"><\/div>\n    <\/div>\n  <\/section>\n\n  <p class=\"foot\">\n    <b>模型假設:<\/b>保單美元計價、借款台幣計息;融資利率為單利、逐年繳息、本金到期償還。解約金為期初匯率下的台幣值,情境列以「解約金 × (期末匯率 ÷ 期初匯率)」重估,台幣負債固定不動。<b>單利年化報酬 = (期末淨值 − 自備款) ÷ 自備款 ÷ 年數<\/b>,期末淨值 = 解約金 − 融資本金 − 累計利息。<br>\n    本試算僅為結構示意,未計入解約費用、匯款成本、台幣利率調整及美元/保單 IRR 之非保證分紅波動;實際報酬將有差異。非要約或投資建議。\n  <\/p>\n\n<\/div>\n\n<script>\n(function(){\n  const $=id=>document.getElementById(id);\n  const ids=[\"premium\",\"dpRate\",\"loanRate\",\"baseRate\",\"sv10\",\"sv20\"];\n  const defaults={premium:2000000,dpRate:40,loanRate:2,baseRate:32.30,sv10:3085504,sv20:4834789};\n\n  const nf=n=>Math.round(n).toLocaleString(\"en-US\");\n  const pf=n=>(n>=0?\"+\":\"\")+n.toFixed(2)+\"%\";\n  const rate2=n=>n.toFixed(2);\n\n  function readInputs(){\n    return {\n      P:+$(\"premium\").value||0,\n      dpRate:+$(\"dpRate\").value||0,\n      loanRate:+$(\"loanRate\").value||0,\n      e0:+$(\"baseRate\").value||1,\n      sv10:+$(\"sv10\").value||0,\n      sv20:+$(\"sv20\").value||0\n    };\n  }\n\n  // core: given surrender value at base rate, horizon, exit rate\n  function calc(svBase,years,exit,I){\n    const dp=I.P*I.dpRate/100;\n    const loan=I.P-dp;\n    const annualInt=loan*I.loanRate/100;\n    const sv=svBase*(exit/I.e0);\n    const totalInt=annualInt*years;\n    const net=sv-loan-totalInt;\n    const gain=net-dp;\n    const ret=dp!==0?gain/dp/years*100:0;\n    return {dp,loan,annualInt,sv,totalInt,net,gain,ret};\n  }\n\n  function breakeven(svBase,years,I){\n    const dp=I.P*I.dpRate/100;\n    const loan=I.P-dp;\n    const annualInt=loan*I.loanRate/100;\n    const reqSV=dp+loan+annualInt*years;\n    const eBE=I.e0*reqSV/svBase;\n    const appr=(I.e0-eBE)/I.e0*100;\n    return {eBE,appr};\n  }\n\n  function cls(ret){return ret>=5?\"g\":ret>=0?\"a\":\"r\";}\n\n  // ---- waterfall renderer ----\n  function renderFall(el,title,years,headline,c){\n    const scale=Math.max(c.sv,c.dp,1);\n    const H=172;\n    const h=v=>Math.max(0,v/scale*H);\n    const netTop=Math.max(0,c.net);\n    const cLevel=Math.max(0,c.net); // level after loan+interest deducted = net\n    // deduction bars float:\n    const loanSpacer=h(c.sv-c.loan);        // transparent under loan bar\n    const loanBar=h(c.loan);\n    const intSpacer=h(c.net<0?0:c.net);     // transparent under interest bar (sits above net)\n    const intBar=h(c.totalInt);\n    const retClass=cls(c.ret);\n    const retColor=retClass===\"g\"?\"var(--green)\":retClass===\"a\"?\"var(--amber)\":\"var(--rust)\";\n\n    el.innerHTML=`\n      <h3>${title}<span class=\"rate\" style=\"color:${retColor}\">${pf(c.ret)}<\/span><\/h3>\n      <div class=\"yr\">${years} 年期 · 期末淨值推導<\/div>\n      <div class=\"chart\">\n        <div class=\"col\">\n          <div class=\"bar sv\" style=\"height:${h(c.sv)}px\"><span class=\"val\">${nf(c.sv)}<\/span><\/div>\n          <div class=\"cap\">解約金<\/div>\n        <\/div>\n        <div class=\"col\">\n          <div class=\"spacer\" style=\"height:${loanSpacer}px\"><\/div>\n          <div class=\"bar ded\" style=\"height:${loanBar}px\"><span class=\"val\">−${nf(c.loan)}<\/span><\/div>\n          <div class=\"cap\">扣融資本金<\/div>\n        <\/div>\n        <div class=\"col\">\n          <div class=\"spacer\" style=\"height:${intSpacer}px\"><\/div>\n          <div class=\"bar ded\" style=\"height:${intBar}px\"><span class=\"val\">−${nf(c.totalInt)}<\/span><\/div>\n          <div class=\"cap\">扣${years}年利息<\/div>\n        <\/div>\n        <div class=\"col\">\n          <div class=\"bar net\" style=\"height:${h(netTop)}px;background:${c.net<0?'var(--rust)':'var(--green)'}\"><span class=\"val\">${nf(c.net)}<\/span><\/div>\n          <div class=\"cap\">期末淨值<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"summary\">\n        <span class=\"k\">浮盈(淨值−本金)<\/span>\n        <span class=\"v\" style=\"color:${c.gain<0?'var(--rust)':'var(--navy)'}\">${c.gain>=0?'+':''}${nf(c.gain)}<\/span>\n      <\/div>\n      <div class=\"summary\" style=\"border-top:none;padding-top:2px;margin-top:2px\">\n        <span class=\"k\">投入本金 ${nf(c.dp)} · 單利年化<\/span>\n        <span class=\"v\" style=\"color:${retColor}\">${pf(c.ret)}<\/span>\n      <\/div>`;\n  }\n\n  // ---- scenario table ----\n  const scen=[\n    {t:\"台幣升值 20%\",m:-20},{t:\"台幣升值 15%\",m:-15},{t:\"台幣升值 10%\",m:-10},{t:\"台幣升值 5%\",m:-5},\n    {t:\"匯率持平\",m:0},\n    {t:\"台幣貶值 5%\",m:5},{t:\"台幣貶值 10%\",m:10},{t:\"台幣貶值 15%\",m:15},{t:\"台幣貶值 20%\",m:20}\n  ];\n  function renderTable(I){\n    const body=$(\"scenBody\");body.innerHTML=\"\";\n    scen.forEach(s=>{\n      const exit=I.e0*(1+s.m/100);\n      const r10=calc(I.sv10,10,exit,I).ret;\n      const r20=calc(I.sv20,20,exit,I).ret;\n      const tr=document.createElement(\"tr\");\n      if(s.m===0)tr.className=\"base\";\n      tr.innerHTML=`<td>${s.t}<\/td><td>${rate2(exit)}<\/td>`+\n        `<td><span class=\"tag ${cls(r10)}\">${pf(r10)}<\/span><\/td>`+\n        `<td><span class=\"tag ${cls(r20)}\">${pf(r20)}<\/span><\/td>`;\n      body.appendChild(tr);\n    });\n  }\n\n  function renderBE(I){\n    const b10=breakeven(I.sv10,10,I),b20=breakeven(I.sv20,20,I);\n    $(\"be10\").innerHTML=`<div class=\"lab\">10 年期<\/div>\n      <div class=\"rate\">${rate2(b10.eBE)}<\/div>\n      <div class=\"note\">台幣需升值逾 <b>${b10.appr.toFixed(1)}%<\/b>(匯率跌破此值)報酬才轉負。<\/div>`;\n    $(\"be20\").innerHTML=`<div class=\"lab\">20 年期<\/div>\n      <div class=\"rate\">${rate2(b20.eBE)}<\/div>\n      <div class=\"note\">台幣需升值逾 <b>${b20.appr.toFixed(1)}%<\/b>(匯率跌破此值)報酬才轉負。<\/div>`;\n  }\n\n  function syncSlider(I){\n    const sl=$(\"fxSlider\");\n    // keep slider centred around base; widen range if base moved a lot\n    sl.min=(I.e0*0.72).toFixed(2);\n    sl.max=(I.e0*1.24).toFixed(2);\n    document.querySelectorAll(\".rail-labels span\")[1].textContent=rate2(I.e0)+\" (期初)\";\n    document.querySelectorAll(\".rail-labels span\")[0].textContent=sl.min+\" (台幣強)\";\n    document.querySelectorAll(\".rail-labels span\")[2].textContent=sl.max+\" (台幣弱)\";\n  }\n\n  function renderLive(){\n    const I=readInputs();\n    const exit=+$(\"fxSlider\").value;\n    const move=(exit-I.e0)/I.e0*100; // positive = TWD weaker\n    $(\"fxVal\").textContent=rate2(exit);\n    const moveEl=$(\"fxMove\");\n    if(Math.abs(move)<0.05){\n      $(\"fxRel\").textContent=\"(匯率持平)\";\n      moveEl.textContent=\"基準\";moveEl.style.background=\"var(--ivory)\";moveEl.style.color=\"var(--muted)\";\n    }else if(move<0){\n      $(\"fxRel\").textContent=\"\";\n      moveEl.textContent=\"台幣升值 \"+Math.abs(move).toFixed(1)+\"%\";\n      moveEl.style.background=\"var(--peri-soft)\";moveEl.style.color=\"var(--navy)\";\n    }else{\n      $(\"fxRel\").textContent=\"\";\n      moveEl.textContent=\"台幣貶值 \"+move.toFixed(1)+\"%\";\n      moveEl.style.background=\"var(--green-soft)\";moveEl.style.color=\"var(--green)\";\n    }\n    renderFall($(\"fall10\"),\"10 年期\",10,10.5,calc(I.sv10,10,exit,I));\n    renderFall($(\"fall20\"),\"20 年期\",20,14.7,calc(I.sv20,20,exit,I));\n  }\n\n  function renderAll(){\n    const I=readInputs();\n    const dp=I.P*I.dpRate/100, loan=I.P-dp, annualInt=loan*I.loanRate/100;\n    $(\"d-dp\").textContent=nf(dp);\n    $(\"d-loan\").textContent=nf(loan);\n    $(\"d-int\").textContent=nf(annualInt)+\" /年\";\n    $(\"spotBase\").textContent=rate2(I.e0);\n    syncSlider(I);\n    renderLive();\n    renderTable(I);\n    renderBE(I);\n  }\n\n  // events\n  ids.forEach(id=>$(id).addEventListener(\"input\",()=>{\n    // if base rate changed, re-centre slider to base\n    if(id===\"baseRate\"){ $(\"fxSlider\").value=(+$(\"baseRate\").value||32.3); }\n    renderAll();\n  }));\n  $(\"fxSlider\").addEventListener(\"input\",renderLive);\n  $(\"btnReset\").addEventListener(\"click\",()=>{\n    ids.forEach(id=>$(id).value=defaults[id]);\n    $(\"fxSlider\").value=defaults.baseRate;\n    renderAll();\n  });\n  $(\"btnPrint\").addEventListener(\"click\",()=>window.print());\n\n  renderAll();\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"key": "fcn", "label": "FCN 槓桿", "full": "FCN槓桿試算", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>FCN 投資質借槓桿試算 ｜ 渣打亞灣貴賓<\/title>\n<style>\n  :root{\n    --pine:#0A3D3A; --pine2:#072E2B; --pine3:#0F4E4A;\n    --gold:#C7A24B; --goldl:#E7D29A;\n    --green:#2E7D5B; --greenl:#EAF2EE;\n    --ink:#1B2B29; --muted:#6E7F7C; --gray:#9AA6A4; --grayd:#5C6B69;\n    --line:#DCE4E2; --surface:#FFFFFF; --bg:#F1F5F4; --card:#EEF3F2;\n    --red:#B23A3A;\n    --cjk:\"Microsoft JhengHei\",\"PingFang TC\",\"Heiti TC\",sans-serif;\n    --num:\"Microsoft JhengHei\",\"PingFang TC\",sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    font-family:var(--cjk); color:var(--ink); background:var(--bg);\n    line-height:1.5; -webkit-font-smoothing:antialiased;\n  }\n  .num{font-variant-numeric:tabular-nums; font-feature-settings:\"tnum\" 1;}\n  .wrap{max-width:1120px; margin:0 auto; padding:0 20px 64px;}\n\n  /* Header */\n  header.top{\n    background:linear-gradient(160deg,var(--pine) 0%, var(--pine2) 100%);\n    color:#fff; padding:26px 0 30px;\n  }\n  .top-inner{max-width:1120px; margin:0 auto; padding:0 20px;}\n  .eyebrow{font-size:12px; letter-spacing:.22em; font-weight:700; color:var(--goldl); text-transform:uppercase;}\n  header.top h1{font-size:clamp(24px,4.4vw,38px); font-weight:900; margin:8px 0 6px; letter-spacing:.01em;}\n  header.top h1 .accent{color:var(--gold);}\n  header.top p.sub{margin:0; color:#CFE0DD; font-size:15px; max-width:70ch;}\n\n  /* Hero breakeven readout */\n  .hero{\n    background:var(--pine3); color:#fff; border-radius:16px;\n    margin-top:-16px; padding:26px 28px; box-shadow:0 18px 40px -24px rgba(7,46,43,.55);\n    display:grid; grid-template-columns:1.15fr .85fr; gap:26px; align-items:center;\n    border:1px solid rgba(199,162,75,.35);\n  }\n  .hero .label{font-size:13px; color:#BFD2CF; font-weight:500; letter-spacing:.02em;}\n  .hero .big{font-size:clamp(40px,8vw,68px); font-weight:900; color:var(--goldl); line-height:1.02; margin:6px 0 2px;}\n  .hero .big small{font-size:.42em; font-weight:700; color:#fff; margin-left:6px;}\n  .hero .prem{font-size:16px; color:#fff;}\n  .hero .prem b{color:var(--gold);}\n  .hero .note{font-size:12.5px; color:#9FB8B4; margin-top:12px;}\n  .hero-right{background:var(--pine2); border-radius:12px; padding:18px 20px; border:1px solid rgba(255,255,255,.06);}\n  .hero-right .cap{font-size:12px; color:#9FB8B4; letter-spacing:.02em;}\n  .hero-right .yield{font-size:34px; font-weight:900; color:#fff; margin:2px 0 10px;}\n  .hero-right .yrow{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-top:1px solid rgba(255,255,255,.08); color:#DCEAE7;}\n  .hero-right .yrow b{color:#fff; font-weight:700;}\n\n  /* Panels grid */\n  .grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:22px;}\n  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 22px 24px;}\n  .panel h2{font-size:17px; font-weight:900; margin:0 0 4px; color:var(--pine);}\n  .panel .desc{font-size:12.5px; color:var(--muted); margin:0 0 16px;}\n\n  /* Controls */\n  .ctrl{margin-bottom:18px;}\n  .ctrl:last-child{margin-bottom:0;}\n  .ctrl .crow{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}\n  .ctrl label{font-size:14px; font-weight:700; color:var(--ink);}\n  .ctrl .valbox{display:flex; align-items:center; gap:4px;}\n  .ctrl input[type=number]{\n    width:96px; text-align:right; font-family:var(--num); font-variant-numeric:tabular-nums;\n    font-size:16px; font-weight:700; color:var(--pine);\n    border:1px solid var(--line); border-radius:8px; padding:5px 8px; background:#fff;\n  }\n  .ctrl .unit{font-size:13px; color:var(--muted); min-width:26px;}\n  .ctrl input[type=number]:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}\n  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:6px;\n    background:var(--card); outline:none;}\n  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:22px; height:22px;\n    border-radius:50%; background:var(--green); border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer;}\n  input[type=range]::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:var(--green);\n    border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer;}\n  input[type=range].g::-webkit-slider-thumb{background:var(--gold);}\n  input[type=range].g::-moz-range-thumb{background:var(--gold);}\n  input[type=range]:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}\n\n  /* Head-to-head */\n  .verdict{border-radius:12px; padding:16px 18px; margin-bottom:18px; text-align:center; font-weight:700;}\n  .verdict.win{background:var(--greenl); color:var(--green); border:1px solid #BBD8CC;}\n  .verdict.lose{background:#FBF3F1; color:var(--red); border:1px solid #E8CFC9;}\n  .verdict.tie{background:#FBF6E9; color:#8A6D1E; border:1px solid #EBDCB0;}\n  .verdict .vbig{font-size:26px; font-weight:900; display:block; margin-top:2px;}\n\n  .barset{margin:6px 0 6px;}\n  .barrow{margin:12px 0;}\n  .barrow .bhead{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px;}\n  .barrow .bhead .who{font-weight:700;}\n  .barrow .bhead .amt{font-family:var(--num); font-variant-numeric:tabular-nums; font-weight:700;}\n  .bartrack{height:26px; background:var(--card); border-radius:7px; overflow:hidden;}\n  .barfill{height:100%; border-radius:7px; transition:width .35s ease;}\n  .barfill.sc{background:var(--green);}\n  .barfill.ot{background:var(--gray);}\n\n  /* Breakdown */\n  .bd{border-top:1px solid var(--line); margin-top:16px; padding-top:14px;}\n  .bd .brow{display:flex; justify-content:space-between; font-size:14px; padding:6px 0; color:var(--ink);}\n  .bd .brow .l{color:var(--muted);}\n  .bd .brow .v{font-family:var(--num); font-variant-numeric:tabular-nums; font-weight:700;}\n  .bd .brow.tot{border-top:2px solid var(--pine); margin-top:6px; padding-top:10px; font-size:16px;}\n  .bd .brow.tot .v{color:var(--green); font-size:20px; font-weight:900;}\n  .pos{color:var(--green);} .neg{color:var(--red);}\n\n  /* Sensitivity table */\n  .tablewrap{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px;}\n  .tablewrap h2{font-size:17px; font-weight:900; margin:0 0 4px; color:var(--pine);}\n  .tablewrap .desc{font-size:12.5px; color:var(--muted); margin:0 0 16px;}\n  table{width:100%; border-collapse:collapse; font-size:14px;}\n  thead th{background:var(--pine); color:#fff; font-weight:700; padding:11px 10px; text-align:center; font-size:13.5px;}\n  thead th:first-child{border-radius:8px 0 0 0;} thead th:last-child{border-radius:0 8px 0 0;}\n  tbody td{padding:10px; text-align:center; border-bottom:1px solid var(--line); font-family:var(--num); font-variant-numeric:tabular-nums;}\n  tbody tr:nth-child(even){background:#F7FAF9;}\n  tbody tr.be{background:var(--greenl) !important; font-weight:900;}\n  tbody tr.be td{color:var(--green);}\n  td.sc{color:var(--green); font-weight:700;}\n  td.delta.pos{color:var(--green); font-weight:800;}\n  td.delta.neg{color:var(--red); font-weight:800;}\n\n  .foot{font-size:11.5px; color:var(--muted); margin-top:22px; line-height:1.7;}\n  .foot b{color:var(--grayd);}\n\n  .warn{display:none; background:#FBF3F1; color:var(--red); border:1px solid #E8CFC9;\n    border-radius:10px; padding:10px 14px; font-size:13px; margin-top:14px; font-weight:700;}\n\n  .printbtn{margin-top:14px; border:1px solid var(--gold); background:transparent; color:var(--goldl);\n    border-radius:999px; padding:7px 18px; font:inherit; font-size:13px; font-weight:700; cursor:pointer;}\n  .printbtn:hover{background:rgba(199,162,75,.15);}\n  @media print{\n    body{background:#fff;}\n    header.top,.hero,.hero-right{-webkit-print-color-adjust:exact; print-color-adjust:exact;}\n    .printbtn,input[type=range]{display:none !important;}\n    .hero{margin-top:12px; box-shadow:none; break-inside:avoid;}\n    section,.card{break-inside:avoid;}\n    @page{size:A4; margin:12mm;}\n  }\n\n  @media (max-width:820px){\n    .hero{grid-template-columns:1fr; gap:18px;}\n    .grid{grid-template-columns:1fr;}\n    .ctrl input[type=number]{width:84px; font-size:15px;}\n  }\n<\/style>\n<\/head>\n<body>\n<header class=\"top\">\n  <div class=\"top-inner\">\n    <div class=\"eyebrow\">渣打亞灣貴賓理財 ‧ 投資質借試算<\/div>\n    <h1>他行票面要贏，<span class=\"accent\">得高過多少？<\/span><\/h1>\n    <p class=\"sub\">在渣打加「一層」投資質借槓桿後，同一筆資金的實拿會被墊高。調整下方條件，即時看出他行 FCN 票面必須高到哪裡，才追得上渣打。<\/p>\n    <button type=\"button\" class=\"printbtn\" onclick=\"window.print()\">列印 / 匯出 PDF<\/button>\n  <\/div>\n<\/header>\n\n<div class=\"wrap\">\n  <!-- HERO -->\n  <section class=\"hero\">\n    <div>\n      <div class=\"label\">他行 FCN 票面必須 ≥<\/div>\n      <div class=\"big num\"><span id=\"beCoupon\">10.7<\/span><small>% / 年<\/small><\/div>\n      <div class=\"prem\">才追得上渣打 — 等於要比渣打票面 <b class=\"num\" id=\"bePrem\">+2.7%<\/b> 以上<\/div>\n      <div class=\"note\">＊模型：加一層質借（僅借 1 次）、兩邊連結標的相同、未計稅負與費用。<\/div>\n    <\/div>\n    <div class=\"hero-right\">\n      <div class=\"cap\">渣打槓桿後 ‧ 實質年化<\/div>\n      <div class=\"yield num\"><span id=\"scYield\">10.7<\/span>%<\/div>\n      <div class=\"yrow\"><span>一年實拿<\/span><b class=\"num\" id=\"scTotalTop\">$21,400<\/b><\/div>\n      <div class=\"yrow\"><span>投入資金<\/span><b class=\"num\" id=\"capTop\">$200,000<\/b><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"grid\">\n    <!-- LEFT: SC conditions -->\n    <div class=\"panel\">\n      <h2>渣打條件<\/h2>\n      <p class=\"desc\">這些設定決定「打平線」— 他行要高過多少才追平。<\/p>\n\n      <div class=\"ctrl\">\n        <div class=\"crow\">\n          <label for=\"capN\">投入資金<\/label>\n          <div class=\"valbox\"><span class=\"unit\">US$<\/span><input class=\"num\" type=\"number\" id=\"capN\" min=\"10000\" max=\"10000000\" step=\"10000\" value=\"200000\"><\/div>\n        <\/div>\n        <input type=\"range\" id=\"capR\" min=\"50000\" max=\"2000000\" step=\"10000\" value=\"200000\">\n      <\/div>\n\n      <div class=\"ctrl\">\n        <div class=\"crow\">\n          <label for=\"scN\">渣打 FCN 票面<\/label>\n          <div class=\"valbox\"><input class=\"num\" type=\"number\" id=\"scN\" min=\"0\" max=\"30\" step=\"0.1\" value=\"8.0\"><span class=\"unit\">%<\/span><\/div>\n        <\/div>\n        <input type=\"range\" id=\"scR\" min=\"0\" max=\"20\" step=\"0.1\" value=\"8.0\">\n      <\/div>\n\n      <div class=\"ctrl\">\n        <div class=\"crow\">\n          <label for=\"ltvN\">質借成數（LTV）<\/label>\n          <div class=\"valbox\"><input class=\"num\" type=\"number\" id=\"ltvN\" min=\"0\" max=\"90\" step=\"1\" value=\"45\"><span class=\"unit\">%<\/span><\/div>\n        <\/div>\n        <input type=\"range\" id=\"ltvR\" min=\"0\" max=\"90\" step=\"1\" value=\"45\">\n      <\/div>\n\n      <div class=\"ctrl\">\n        <div class=\"crow\">\n          <label for=\"finN\">質借利率<\/label>\n          <div class=\"valbox\"><input class=\"num\" type=\"number\" id=\"finN\" min=\"0\" max=\"15\" step=\"0.1\" value=\"2.0\"><span class=\"unit\">%<\/span><\/div>\n        <\/div>\n        <input type=\"range\" id=\"finR\" min=\"0\" max=\"10\" step=\"0.1\" value=\"2.0\">\n      <\/div>\n\n      <div class=\"warn\" id=\"warn\">提醒：質借利率已高於渣打票面，加槓桿反而不利，此時他行只要票面更高就會勝出。<\/div>\n    <\/div>\n\n    <!-- RIGHT: head to head -->\n    <div class=\"panel\">\n      <h2>和他行正面對決<\/h2>\n      <p class=\"desc\">拉動他行票面，即時看誰的實拿較高。<\/p>\n\n      <div class=\"ctrl\">\n        <div class=\"crow\">\n          <label for=\"otN\">他行 FCN 票面<\/label>\n          <div class=\"valbox\"><input class=\"num\" type=\"number\" id=\"otN\" min=\"0\" max=\"30\" step=\"0.1\" value=\"9.0\"><span class=\"unit\">%<\/span><\/div>\n        <\/div>\n        <input type=\"range\" class=\"g\" id=\"otR\" min=\"0\" max=\"20\" step=\"0.1\" value=\"9.0\">\n      <\/div>\n\n      <div class=\"verdict win\" id=\"verdict\">\n        渣打多賺\n        <span class=\"vbig num\" id=\"verdictBig\">+US$3,400 / 年<\/span>\n      <\/div>\n\n      <div class=\"barset\">\n        <div class=\"barrow\">\n          <div class=\"bhead\"><span class=\"who\" style=\"color:var(--green)\">渣打（槓桿一次）<\/span><span class=\"amt num\" id=\"scBarAmt\" style=\"color:var(--green)\">$21,400<\/span><\/div>\n          <div class=\"bartrack\"><div class=\"barfill sc\" id=\"scBar\" style=\"width:100%\"><\/div><\/div>\n        <\/div>\n        <div class=\"barrow\">\n          <div class=\"bhead\"><span class=\"who\" style=\"color:var(--grayd)\">他行（無槓桿）<\/span><span class=\"amt num\" id=\"otBarAmt\" style=\"color:var(--grayd)\">$18,000<\/span><\/div>\n          <div class=\"bartrack\"><div class=\"barfill ot\" id=\"otBar\" style=\"width:84%\"><\/div><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"bd\">\n        <div class=\"brow\"><span class=\"l\">本金配息<\/span><span class=\"v num\" id=\"bdBase\">$16,000<\/span><\/div>\n        <div class=\"brow\"><span class=\"l\">質借加碼<\/span><span class=\"v num pos\" id=\"bdAdd\">+$7,200<\/span><\/div>\n        <div class=\"brow\"><span class=\"l\">借款成本<\/span><span class=\"v num neg\" id=\"bdCost\">−$1,800<\/span><\/div>\n        <div class=\"brow tot\"><span class=\"l\" style=\"color:var(--pine);font-weight:700\">渣打一年實拿<\/span><span class=\"v num\" id=\"bdTotal\">$21,400<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Sensitivity table -->\n  <div class=\"tablewrap\">\n    <h2>敏感度一覽<\/h2>\n    <p class=\"desc\">他行票面由低到高，渣打實拿固定在 <span class=\"num\" id=\"descSC\">$21,400<\/span>。綠色列即「打平線」。<\/p>\n    <table>\n      <thead>\n        <tr><th>他行票面<\/th><th>他行實拿<\/th><th>渣打實拿<\/th><th>渣打多賺<\/th><\/tr>\n      <\/thead>\n      <tbody id=\"tbody\"><\/tbody>\n    <\/table>\n  <\/div>\n\n  <p class=\"foot\">\n    ＊本工具為情境試算示範，數字依輸入條件即時計算，<b>未計入稅負、手續費、匯率變動與追繳風險<\/b>，不構成投資建議或招攬。<br>\n    ＊模型假設：僅加一層質借（借款 1 次、不重複疊加）、渣打與他行連結標的相同、配息以年化單利計算。<br>\n    ＊FCN 為條件式配息，實際依 KO／KI 等產品條款而定；槓桿會同時放大收益與虧損。投資涉及風險，過往績效不代表未來表現。\n  <\/p>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var f0 = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});\n  function usd(n){ return '$' + f0.format(Math.round(n)); }\n  function usdSign(n){ var s = n<0?'−':'+'; return s + '$' + f0.format(Math.abs(Math.round(n))); }\n  function pct(n){ return (Math.round(n*10)/10).toFixed(1); }\n\n  // state (percent inputs stored as percent numbers)\n  var st = { cap:200000, sc:8.0, ltv:45, fin:2.0, ot:9.0 };\n\n  // link a slider + number field to a state key\n  function bind(key, rId, nId, min, max){\n    var r = document.getElementById(rId), n = document.getElementById(nId);\n    function set(v, from){\n      v = parseFloat(v);\n      if(isNaN(v)) return;\n      if(v<min) v=min; if(v>max) v=max;\n      st[key]=v;\n      // keep slider within its own range but let number go beyond\n      if(from!=='r'){ r.value = Math.min(Math.max(v, parseFloat(r.min)), parseFloat(r.max)); }\n      if(from!=='n'){ n.value = v; }\n      render();\n    }\n    r.addEventListener('input', function(){ set(r.value,'r'); });\n    n.addEventListener('input', function(){ set(n.value,'n'); });\n    n.addEventListener('blur', function(){ if(n.value==='') { n.value=st[key]; } });\n  }\n\n  bind('cap','capR','capN',10000,10000000);\n  bind('sc','scR','scN',0,30);\n  bind('ltv','ltvR','ltvN',0,90);\n  bind('fin','finR','finN',0,15);\n  bind('ot','otR','otN',0,30);\n\n  function calc(){\n    var P=st.cap, rSC=st.sc/100, ltv=st.ltv/100, f=st.fin/100, rOT=st.ot/100;\n    var loan=P*ltv;\n    var base=P*rSC;\n    var add=loan*rSC;\n    var cost=loan*f;\n    var scTotal=base+add-cost;\n    var scYield=scTotal/P;\n    var breakeven=rSC*(1+ltv)-ltv*f;   // == scYield\n    var prem=breakeven-rSC;\n    var otTotal=P*rOT;\n    var gap=scTotal-otTotal;\n    return {P:P,loan:loan,base:base,add:add,cost:cost,scTotal:scTotal,scYield:scYield,\n            breakeven:breakeven,prem:prem,otTotal:otTotal,gap:gap,rSC:rSC,f:f};\n  }\n\n  function buildTable(c){\n    var tb=document.getElementById('tbody');\n    tb.innerHTML='';\n    var beP = c.breakeven*100;              // breakeven coupon in %\n    var start = Math.max(0, Math.floor((c.rSC*100)*2)/2); // step 0.5 from SC coupon\n    var rows=[];\n    for(var v=start; v<=beP+1.0001; v+=0.5){ rows.push(Math.round(v*10)/10); }\n    // ensure exact breakeven line present\n    var beR = Math.round(beP*10)/10;\n    if(rows.indexOf(beR)===-1){ rows.push(beR); rows.sort(function(a,b){return a-b;}); }\n    rows.forEach(function(v){\n      var ot = c.P*(v/100);\n      var d = c.scTotal - ot;\n      var isBE = Math.abs(v-beR) < 0.05;\n      var tr=document.createElement('tr');\n      if(isBE) tr.className='be';\n      var dtxt = isBE ? '打平' : usdSign(d);\n      var dcls = isBE ? '' : (d>=0?'delta pos':'delta neg');\n      tr.innerHTML =\n        '<td>'+pct(v)+'%<\/td>'+\n        '<td>'+usd(ot)+'<\/td>'+\n        '<td class=\"sc\">'+usd(c.scTotal)+'<\/td>'+\n        '<td class=\"'+dcls+'\">'+dtxt+'<\/td>';\n      tb.appendChild(tr);\n    });\n  }\n\n  function render(){\n    var c=calc();\n\n    // hero\n    document.getElementById('beCoupon').textContent = pct(c.breakeven*100);\n    document.getElementById('bePrem').textContent = '+'+pct(c.prem*100)+'%';\n    document.getElementById('scYield').textContent = pct(c.scYield*100);\n    document.getElementById('scTotalTop').textContent = usd(c.scTotal);\n    document.getElementById('capTop').textContent = usd(c.P);\n    document.getElementById('descSC').textContent = usd(c.scTotal);\n\n    // warn if leverage unhelpful\n    document.getElementById('warn').style.display = (c.rSC - c.f <= 0) ? 'block' : 'none';\n\n    // breakdown\n    document.getElementById('bdBase').textContent = usd(c.base);\n    document.getElementById('bdAdd').textContent = '+'+usd(c.add);\n    document.getElementById('bdCost').textContent = '−'+usd(c.cost);\n    document.getElementById('bdTotal').textContent = usd(c.scTotal);\n\n    // head-to-head bars\n    var mx = Math.max(c.scTotal, c.otTotal, 1);\n    document.getElementById('scBar').style.width = (100*c.scTotal/mx)+'%';\n    document.getElementById('otBar').style.width = (100*c.otTotal/mx)+'%';\n    document.getElementById('scBarAmt').textContent = usd(c.scTotal);\n    document.getElementById('otBarAmt').textContent = usd(c.otTotal);\n\n    // verdict\n    var vd=document.getElementById('verdict'), vb=document.getElementById('verdictBig');\n    if(Math.abs(c.gap) < 1){\n      vd.className='verdict tie'; vd.firstChild.textContent='兩邊打平';\n      vb.textContent='US$0 / 年';\n    } else if(c.gap>0){\n      vd.className='verdict win'; vd.firstChild.textContent='渣打多賺';\n      vb.textContent = usdSign(c.gap).replace('$','US$') + ' / 年';\n    } else {\n      vd.className='verdict lose'; vd.firstChild.textContent='他行多賺';\n      vb.textContent = usdSign(-c.gap).replace('$','US$') + ' / 年';\n    }\n\n    buildTable(c);\n  }\n\n  render();\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"key": "pledge", "label": "質押槓桿", "full": "質押槓桿試算", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />\n<title>質押槓桿試算<\/title>\n<style>\n/* Layout: navy masthead → holdings ledger (add/edit rows, per-row pledge) → loan & margin status → yield swap → stress test → disclosure */\n:root{\n  --bg:#f3f5f9; --paper:#ffffff; --ink:#13203a; --muted:#5a6680; --line:#d8dde7; --field:#f6f7fa;\n  --band:#13284b; --band-ink:#f2ead6; --gold:#9c7726; --gold-hi:#c9a24e; --gold-soft:#f3ecda;\n  --seg-a:#1f3c6e; --seg-b:#c9a24e; --track:#e6e9f0;\n  --good:#2b7a57; --warn:#a86b12; --bad:#b03636; --good-bg:#e3f2ea; --warn-bg:#fbf0dc; --bad-bg:#f8e3e3;\n  --f-display:\"Songti TC\",\"Noto Serif TC\",\"Noto Serif CJK TC\",\"PMingLiU\",Georgia,serif;\n  --f-body:\"PingFang TC\",\"Microsoft JhengHei\",\"Noto Sans TC\",\"Noto Sans CJK TC\",system-ui,sans-serif;\n  --f-num:\"SF Mono\",\"Roboto Mono\",Consolas,\"Microsoft JhengHei\",monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#0a1324; --paper:#101c33; --ink:#e7ebf3; --muted:#97a3bc; --line:#23324f; --field:#0c172b;\n  --band:#0d1830; --band-ink:#ecdcb3; --gold:#d6b46c; --gold-hi:#d6b46c; --gold-soft:#1d2534;\n  --seg-a:#4d6fae; --seg-b:#d6b46c; --track:#1b2a46;\n  --good:#5fc196; --warn:#e2a64a; --bad:#ec7a7a; --good-bg:#12302a; --warn-bg:#33281a; --bad-bg:#3a1d22; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0a1324; --paper:#101c33; --ink:#e7ebf3; --muted:#97a3bc; --line:#23324f; --field:#0c172b;\n  --band:#0d1830; --band-ink:#ecdcb3; --gold:#d6b46c; --gold-hi:#d6b46c; --gold-soft:#1d2534;\n  --seg-a:#4d6fae; --seg-b:#d6b46c; --track:#1b2a46;\n  --good:#5fc196; --warn:#e2a64a; --bad:#ec7a7a; --good-bg:#12302a; --warn-bg:#33281a; --bad-bg:#3a1d22; color-scheme:dark}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}\n.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\nheader.band{background:var(--band);color:var(--band-ink);border-bottom:2px solid var(--gold-hi)}\nheader.band .wrap{padding-block:22px 18px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between}\n.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi)}\nh1{font-family:var(--f-display);font-weight:700;font-size:28px;margin:4px 0 0;letter-spacing:.04em}\nheader .note{font-size:12px;opacity:.75}\nmain.wrap{padding-block:20px 40px;display:grid;gap:18px}\nsection{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}\nh2{font-family:var(--f-display);font-size:18px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}\nh2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}\n.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}\ninput,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}\ninput.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}\ninput:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}\nbutton{font:inherit;cursor:pointer}\n.btn{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600}\n.btn.solid{background:var(--band);color:var(--band-ink);border-color:var(--band)}\n.btn.ghost{border-color:var(--line);color:var(--muted);font-weight:400}\n.printbtn{margin-top:8px;border-color:var(--gold-hi);color:var(--band-ink)}\n\n/* ledger */\n.ledger{display:grid;gap:0}\n.lrow{display:grid;grid-template-columns:minmax(120px,1.6fr) 92px 88px minmax(110px,1.2fr) 74px 70px minmax(110px,1.2fr) minmax(96px,1fr) minmax(90px,1fr) 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}\n.lrow.head{font-size:12px;color:var(--muted);padding-top:0}\n.lrow.head span:nth-child(n+4){text-align:right}\n.lrow .sub{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}\n@media (max-width:860px){.lrow .sub{text-align:left}}\n.lrow .c{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}\n.lrow .c.dim{color:var(--muted)}\n.lrow .k{display:none}\n.lrow.off{opacity:1}\n.lrow.borrow{background:linear-gradient(90deg,var(--gold-soft),transparent 60%)}\n.pl{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 0;width:100%;font-size:13px;font-weight:600}\n.pl[aria-pressed=\"true\"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}\n:root[data-theme=\"dark\"] .pl[aria-pressed=\"true\"]{border-color:var(--gold)}\n.del{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px}\n.del:hover{color:var(--bad)}\n.lrow.foot{border-bottom:0;font-weight:700}\n.lrow.foot .c{font-size:15px}\n.ledger-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:space-between}\n@media (max-width:860px){\n  .lrow.head{display:none}\n  .lrow{grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}\n  .lrow .k{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}\n  .lrow>div{min-width:0}\n  .lrow .nm{grid-column:1/-1}\n  .lrow .c{text-align:left}\n  .lrow .delc{grid-column:1/-1;text-align:right}\n  .lrow.foot{border:0;padding:4px 0}\n  .lrow.foot .nm{grid-column:1/-1}\n  .lrow.foot .sp{display:none}\n}\n\n/* loan + status */\n.loanbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}\n.unit{position:relative}.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}\n.unit input{padding-right:28px}\n.status{margin-top:16px;border-radius:8px;padding:14px 16px;display:grid;gap:10px}\n.status.ok{background:var(--good-bg)}.status.warn{background:var(--warn-bg)}.status.bad{background:var(--bad-bg)}\n.status .head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}\n.status .tag{font-weight:700;font-size:15px}\n.status.ok .tag{color:var(--good)}.status.warn .tag{color:var(--warn)}.status.bad .tag{color:var(--bad)}\n.eq{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px;overflow-wrap:anywhere}\n.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}\n.fig .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}\n.gtrack{position:relative;height:18px;background:var(--track);border-radius:4px;margin-top:4px}\n.gfill{position:absolute;inset:0 auto 0 0;border-radius:4px}\n.gfill.ok{background:var(--good)}.gfill.warn{background:var(--warn)}.gfill.bad{background:var(--bad)}\n.gmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}\n.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-num)}\n.comp{position:relative;height:26px;background:var(--paper);border-radius:4px;display:flex;margin-top:4px;border:1px solid var(--line)}\n.comp .cs{height:100%;border-right:1px solid var(--paper)}\n.comp .cl{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--bad);border-radius:2px}\n.clg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}\n.clg i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}\n.big2{font-size:18px;color:var(--ink)!important;font-weight:500!important}\n.big2 b{font-family:var(--f-num);font-size:22px}\n.status.ok .big2 b{color:var(--good)}.status.warn .big2 b{color:var(--warn)}.status.bad .big2{color:var(--bad)!important}\n.meter{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}\n.meter>div{display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}\n.meter span{padding:0 10px;font-size:13px;font-weight:600}\n.meter .used{background:var(--seg-a);color:#fff}\n.meter .used.warn{background:var(--warn)}.meter .used.bad{background:var(--bad)}\n.meter .left{flex:1;justify-content:flex-end;color:var(--good)}\n.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.three .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(15px,4vw,20px);font-weight:600}\n.warnline{font-size:13px;color:var(--warn)}\n\n/* yield */\n.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}\n@media (max-width:720px){.hero{grid-template-columns:1fr}}\n.yieldswap{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.yieldswap .y{display:grid;gap:2px}\n.big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;line-height:1.1}\n.big.new{color:var(--gold)}\n.arrow{font-size:22px;color:var(--muted)}\n.delta{font-size:13px;color:var(--muted);flex-basis:100%}\n.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.kpi{border-top:2px solid var(--line);padding-top:8px}\n.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}\nth:first-child,td:first-child{text-align:left}\nth{font-size:12px;font-weight:500;color:var(--muted)}\ntd{font-family:var(--f-num);font-variant-numeric:tabular-nums}\ntd:first-child{font-family:var(--f-body)}\ntr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}\n.neg{color:var(--bad)}\n.tscroll{overflow-x:auto;margin-top:14px}\ninput[type=range]{accent-color:var(--gold-hi);padding:0;border:0;background:transparent}\n.stressout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}\n.explain{margin:0 0 14px;font-size:14px;max-width:68ch;color:var(--ink)}\n.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}\n.card{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}\n.card.cur{border:2px solid var(--gold)}\n.card .ttl{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}\n.card .ttl b{font-size:15px}\n.curtag{font-size:11px;font-weight:700;color:var(--paper);background:var(--gold);border-radius:999px;padding:2px 8px}\n.drop{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;line-height:1}\n.drop.ok{color:var(--good)}.drop.warn{color:var(--warn)}.drop.bad{color:var(--bad)}\n.bar{position:relative;height:30px;background:var(--track);border-radius:4px}\n.bar .cap{position:absolute;inset:0 auto 0 0;background:var(--seg-a);border-radius:4px;opacity:.35}\n.bar .buf{position:absolute;top:0;bottom:0;background:var(--good);opacity:.85;border-radius:0 4px 4px 0}\n.bar .buf.warn{background:var(--warn)}.bar .buf.bad{background:var(--bad)}\n.bar .ln{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--bad);border-radius:2px}\n.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}\n.mini .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}\n.cmplegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:12px}\n.cmplegend i{display:inline-block;width:12px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}\n.lg-cap{background:var(--seg-a);opacity:.35}.lg-line{background:var(--bad);width:3px!important}.lg-buf{background:var(--good)}\n.hint{font-size:12px;color:var(--muted);margin:8px 0 0}\n.disc{font-size:12px;color:var(--muted);line-height:1.7}\n.disc h2{font-size:15px}\n.disc ol{margin:0;padding-left:20px;display:grid;gap:4px}\n@media print{input[type=range],.ledger-actions,.del,.printbtn{display:none}section{break-inside:avoid}header.band{print-color-adjust:exact;-webkit-print-color-adjust:exact}}\n@media (prefers-reduced-motion:no-preference){.gfill,.gmark{transition:all .25s ease}}\n<\/style>\n<\/head>\n<body>\n\n<header class=\"band\"><div class=\"wrap\">\n  <div>\n    <div class=\"eyebrow\">Premium Banking · Lombard Lending<\/div>\n    <h1>質押槓桿試算<\/h1>\n  <\/div>\n  <div class=\"note\">多重商品質押 · 新舊殖利率換算 · 幣別 TWD<br><button type=\"button\" class=\"btn printbtn\" onclick=\"window.print()\">列印 / 匯出 PDF<\/button><\/div>\n<\/div><\/header>\n\n<main class=\"wrap\">\n\n<section>\n  <h2>持有商品與擔保品 <small>每一筆可自由新增、編輯，設質金額可只設部分<\/small><\/h2>\n  <div class=\"ledger\" id=\"ledger\"><\/div>\n  <div class=\"ledger-actions\">\n    <button class=\"btn solid\" id=\"addBtn\" type=\"button\">＋ 新增商品<\/button>\n    <button class=\"btn ghost\" id=\"resetBtn\" type=\"button\">回復範例<\/button>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>借款與追繳檢核 <small>規則：設質金額 × LTV 合計必須大於借款餘額<\/small><\/h2>\n  <div class=\"loanbar\">\n    <div><label class=\"lbl\" for=\"loan\">借款金額<\/label><input class=\"n\" type=\"text\" id=\"loan\" inputmode=\"numeric\"><\/div>\n    <div><label class=\"lbl\" for=\"rate\">質押借款利率（年）<\/label><div class=\"unit\"><input class=\"n\" type=\"number\" id=\"rate\" step=\"0.01\"><span>%<\/span><\/div><\/div>\n    <div><span class=\"lbl\">總質借門檻（可借上限）<\/span><div class=\"fig\"><div class=\"v\" id=\"tTxt\"><\/div><\/div><\/div>\n  <\/div>\n  <div class=\"status\" id=\"status\"><\/div>\n<\/section>\n\n<section>\n  <h2>新舊殖利率換算 <small>以自有資金為分母<\/small><\/h2>\n  <div class=\"hero\">\n    <div class=\"yieldswap\">\n      <div class=\"y\"><span class=\"lbl\">原殖利率<\/span><span class=\"big\" id=\"oldY\"><\/span><\/div>\n      <span class=\"arrow\">→<\/span>\n      <div class=\"y\"><span class=\"lbl\">新殖利率（已扣借款利息）<\/span><span class=\"big new\" id=\"newY\"><\/span><\/div>\n      <div class=\"delta\" id=\"deltaTxt\"><\/div>\n    <\/div>\n    <div class=\"kpis\">\n      <div class=\"kpi\"><div class=\"lbl\">槓桿倍數<\/div><div class=\"v\" id=\"levTxt\"><\/div><\/div>\n      <div class=\"kpi\"><div class=\"lbl\">月淨收益<\/div><div class=\"v\" id=\"monTxt\"><\/div><\/div>\n      <div class=\"kpi\"><div class=\"lbl\">自有資金<\/div><div class=\"v\" id=\"ownTxt\"><\/div><\/div>\n      <div class=\"kpi\"><div class=\"lbl\">借款部位利差<\/div><div class=\"v\" id=\"spreadTxt\"><\/div><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"tscroll\">\n    <table>\n      <thead><tr><th>收益拆解<\/th><th>本金<\/th><th>年<\/th><th>月<\/th><\/tr><\/thead>\n      <tbody id=\"incBody\"><\/tbody>\n    <\/table>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>壓力測試 <small>設質擔保品同步漲跌<\/small><\/h2>\n  <div style=\"display:flex;justify-content:space-between;gap:8px\"><label class=\"lbl\" for=\"stress\">擔保品市值變動<\/label><b id=\"stressTxt\" style=\"font-family:var(--f-num)\"><\/b><\/div>\n  <input type=\"range\" id=\"stress\" min=\"-70\" max=\"30\" step=\"1\" value=\"-20\" style=\"width:100%\">\n  <div class=\"stressout\">\n    <div class=\"kpi\"><div class=\"lbl\">設質擔保品市值<\/div><div class=\"v\" id=\"sV\"><\/div><\/div>\n    <div class=\"kpi\"><div class=\"lbl\">質借門檻<\/div><div class=\"v\" id=\"sT\"><\/div><\/div>\n    <div class=\"kpi\"><div class=\"lbl\">額度使用率<\/div><div class=\"v\" id=\"sU\"><\/div><\/div>\n    <div class=\"kpi\"><div class=\"lbl\">30 天內需還款<\/div><div class=\"v\" id=\"sC\"><\/div><\/div>\n    <div class=\"kpi\"><div class=\"lbl\">或補擔保品市值<\/div><div class=\"v\" id=\"sC2\"><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"disc\">\n  <h2>風險說明<\/h2>\n  <ol>\n    <li>本頁為示意試算，非投資建議或要約；實際 LTV、利率、集中度控管與追繳規則以銀行核定及契約為準。<\/li>\n    <li>殖利率／配息率非保證，基金配息可能來自本金；保單以宣告利率或保價金計算，亦非保證。<\/li>\n    <li>當設質擔保品市值 × LTV 小於或等於借款餘額即觸發追繳，須於 30 天內還款或補足擔保品，否則銀行得處分擔保品。<\/li>\n    <li>未設質的部分不計入質借門檻，但其市值漲跌仍影響客戶整體淨值。定存、活存設質期間不得自由動用，定存提前解約可能減損利息。<\/li>\n    <li>質押利率多為浮動，利率上升將壓縮利差。本試算假設幣別一致；跨幣別配置另有匯率風險，結構債另有發行機構信用與以股票交割等風險。<\/li>\n  <\/ol>\n<\/section>\n<\/main>\n\n<script>\nconst CAT={'基金':{y:8.5,ltv:80},'股票':{y:3.0,ltv:60},'債券':{y:5.0,ltv:70},'結構債':{y:10.0,ltv:50},'保險':{y:4.0,ltv:70},'定存':{y:1.7,ltv:80},'活存':{y:0.5,ltv:80}};\nconst SAMPLE=()=>({rate:1.91,loan:20000000,rows:[\n  {name:'聯博美國收益',cat:'基金',src:'自有',mv:30000000,y:8.5,ltv:80,pp:1},\n  {name:'聯博美國收益',cat:'基金',src:'借款',mv:20000000,y:8.5,ltv:80,pp:0.5},\n  {name:'台幣定存',cat:'定存',src:'自有',mv:3000000,y:1.7,ltv:80,pp:1}]});\nlet S;\ntry{S=JSON.parse(localStorage.getItem('lev-calc-v4'))}catch(e){}\nif(!S||!Array.isArray(S.rows))S=SAMPLE();\nconst save=()=>{try{localStorage.setItem('lev-calc-v4',JSON.stringify(S))}catch(e){}};\nconst $=id=>document.getElementById(id);\nconst num=s=>{const v=parseFloat(String(s).replace(/[^\\d.\\-]/g,''));return isFinite(v)?v:0};\nconst f0=n=>Math.round(n).toLocaleString('en-US');\nconst pc=(x,d=2)=>(x*100).toFixed(d)+'%';\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n\nfunction renderLedger(){\n  const L=$('ledger');\n  let h=`<div class=\"lrow head\"><span>商品名稱<\/span><span>類別<\/span><span>資金來源<\/span><span>市值<\/span><span>殖利率%<\/span><span>LTV%<\/span><span>設質金額<\/span><span>可借額度<\/span><span>年配息<\/span><span><\/span><\/div>`;\n  S.rows.forEach((r,i)=>{\n    h+=`<div class=\"lrow ${r.src==='借款'?'borrow':''}\" data-i=\"${i}\">\n      <div class=\"nm\"><span class=\"k\">商品名稱<\/span><input data-f=\"name\" value=\"${esc(r.name)}\" aria-label=\"商品名稱\"><\/div>\n      <div><span class=\"k\">類別<\/span><select data-f=\"cat\" aria-label=\"類別\">${Object.keys(CAT).map(c=>`<option${c===r.cat?' selected':''}>${c}<\/option>`).join('')}<\/select><\/div>\n      <div><span class=\"k\">資金來源<\/span><select data-f=\"src\" aria-label=\"資金來源\"><option${r.src==='自有'?' selected':''}>自有<\/option><option${r.src==='借款'?' selected':''}>借款<\/option><\/select><\/div>\n      <div><span class=\"k\">市值<\/span><input class=\"n\" data-f=\"mv\" inputmode=\"numeric\" value=\"${f0(r.mv)}\" aria-label=\"市值\"><\/div>\n      <div><span class=\"k\">殖利率%<\/span><input class=\"n\" type=\"number\" step=\"0.1\" data-f=\"y\" value=\"${r.y}\" aria-label=\"殖利率\"><\/div>\n      <div><span class=\"k\">LTV%<\/span><input class=\"n\" type=\"number\" step=\"5\" min=\"0\" max=\"100\" data-f=\"ltv\" value=\"${r.ltv}\" aria-label=\"LTV\"><\/div>\n      <div><span class=\"k\">設質金額<\/span><input class=\"n\" data-f=\"pa\" inputmode=\"numeric\" value=\"${f0(r.mv*r.pp)}\" aria-label=\"設質金額\"><div class=\"sub\" data-out=\"pp\"><\/div><\/div>\n      <div><span class=\"k\">可借額度<\/span><div class=\"c\" data-out=\"cap\"><\/div><\/div>\n      <div><span class=\"k\">年配息<\/span><div class=\"c\" data-out=\"inc\"><\/div><\/div>\n      <div class=\"delc\"><button type=\"button\" class=\"del\" data-f=\"del\" aria-label=\"刪除此筆\">×<\/button><\/div>\n    <\/div>`;\n  });\n  h+=`<div class=\"lrow foot\"><div class=\"nm\">合計<\/div><div class=\"sp\"><\/div><div class=\"sp\"><\/div><div><span class=\"k\">總市值<\/span><div class=\"c\" id=\"totMv\"><\/div><\/div><div class=\"sp\"><\/div><div class=\"sp\"><\/div><div class=\"sp\"><\/div><div><span class=\"k\">總質借門檻<\/span><div class=\"c\" id=\"totCap\"><\/div><\/div><div><span class=\"k\">總年配息<\/span><div class=\"c\" id=\"totInc\"><\/div><\/div><div class=\"sp\"><\/div><\/div>`;\n  L.innerHTML=h;\n}\n\n$('ledger').addEventListener('input',e=>{\n  const row=e.target.closest('.lrow[data-i]');if(!row)return;\n  const r=S.rows[+row.dataset.i], f=e.target.dataset.f;\n  if(f==='name')r.name=e.target.value;\n  if(f==='mv')r.mv=Math.max(0,num(e.target.value));\n  if(f==='y')r.y=num(e.target.value);\n  if(f==='ltv')r.ltv=Math.min(100,Math.max(0,num(e.target.value)));\n  if(f==='pa'){const a=Math.min(r.mv,Math.max(0,num(e.target.value)));r.pp=r.mv>0?a/r.mv:0;}\n  update();\n});\n$('ledger').addEventListener('change',e=>{\n  const row=e.target.closest('.lrow[data-i]');if(!row)return;\n  const r=S.rows[+row.dataset.i], f=e.target.dataset.f;\n  if(f==='cat'){r.cat=e.target.value;r.y=CAT[r.cat].y;r.ltv=CAT[r.cat].ltv;renderLedger();}\n  if(f==='src'){r.src=e.target.value;renderLedger();}\n  if(f==='mv')e.target.value=f0(r.mv);\n  if(f==='pa')e.target.value=f0(r.mv*r.pp);\n  update();\n});\n$('ledger').addEventListener('click',e=>{\n  const row=e.target.closest('.lrow[data-i]');if(!row)return;\n  const i=+row.dataset.i, f=e.target.dataset.f;\n  if(f==='del'){S.rows.splice(i,1);renderLedger();update();}\n});\n$('addBtn').onclick=()=>{S.rows.push({name:'新商品',cat:'債券',src:'借款',mv:0,y:CAT['債券'].y,ltv:CAT['債券'].ltv,pp:1});renderLedger();update();\n  const ins=$('ledger').querySelectorAll('input[data-f=\"mv\"]');ins[ins.length-1].focus();};\n$('resetBtn').onclick=()=>{S=SAMPLE();init();};\n\n$('loan').addEventListener('input',()=>{S.loan=Math.max(0,num($('loan').value));update();});\n$('loan').addEventListener('blur',()=>{$('loan').value=f0(S.loan);});\n$('rate').addEventListener('input',()=>{S.rate=num($('rate').value);update();});\n$('stress').addEventListener('input',update);\n\nfunction update(){\n  const rows=S.rows, L=S.loan, rate=S.rate/100, s=num($('stress').value)/100;\n  let own=0,borrowed=0,mv=0,T=0,V=0,incOwn=0,incB=0,inc=0;\n  const outs=$('ledger').querySelectorAll('.lrow[data-i]');\n  rows.forEach((r,i)=>{\n    const pa=r.mv*r.pp, cap=pa*r.ltv/100, ri=r.mv*r.y/100;\n    mv+=r.mv;inc+=ri;\n    if(r.src==='自有'){own+=r.mv;incOwn+=ri}else{borrowed+=r.mv;incB+=ri}\n    T+=cap;V+=pa;\n    const o=outs[i];if(o){o.querySelector('[data-out=\"cap\"]').textContent=pa>0?f0(cap):'—';o.querySelector('[data-out=\"pp\"]').textContent=r.mv<=0?'':pa>=r.mv-0.5?'全額設質':pa<=0?'未設質':'設質 '+pc(r.pp,0);const pin=o.querySelector('[data-f=\"pa\"]');if(document.activeElement!==pin)pin.value=f0(pa);o.querySelector('[data-out=\"inc\"]').textContent=f0(ri);}\n  });\n  $('totMv').textContent=f0(mv);$('totCap').textContent=f0(T);$('totInc').textContent=f0(inc);\n\n  // margin\n  $('tTxt').textContent=f0(T);\n  const buf=L<=0?1:(T>0?1-L/T:-1);\n  const call=L>0&&T<=L;\n  const lvl=L<=0?'ok':call?'bad':buf<0.15?'warn':'ok';\n  const usage=T>0?L/T:(L>0?Infinity:0);\n  const sDrop=Math.max(0,-s);\n  const unspent=L-borrowed;\n  let note='';\n  if(Math.abs(unspent)>=1) note=unspent>0\n    ?`<div class=\"warnline\">借款尚有 ${f0(unspent)} 未投入任何「借款」來源的商品。<\/div>`\n    :`<div class=\"warnline\">「借款」來源商品合計 ${f0(borrowed)}，超過借款金額 ${f0(-unspent)}；請確認資金來源設定。<\/div>`;\n  const usedW=Math.max(0,Math.min(1,usage))*100;\n  const head=L<=0?'尚無借款':call?'已觸發 Margin Call，30 天內須補足':`擔保品跌超過 <b>${pc(buf,1)}<\/b> 才會被追繳`;\n  $('status').className='status '+lvl;\n  $('status').innerHTML=`\n    <div class=\"tag big2\">${head}<\/div>\n    <div class=\"meter\"><div class=\"used ${lvl}\" style=\"width:${usedW.toFixed(1)}%\"><span>已借 ${isFinite(usage)?pc(usage,0):'—'}<\/span><\/div>\n      <div class=\"left\"><span>${call?'':'還能借 '+pc(Math.max(0,1-usage),0)}<\/span><\/div><\/div>\n    <div class=\"three\">\n      <div><div class=\"lbl\">可借上限<\/div><div class=\"v\">${f0(T)}<\/div><\/div>\n      <div><div class=\"lbl\">已借<\/div><div class=\"v\">${f0(L)}<\/div><\/div>\n      <div><div class=\"lbl\">${call?'需補足':'還能借'}<\/div><div class=\"v\">${f0(Math.abs(T-L))}<\/div><\/div>\n    <\/div>\n    <div class=\"hint\">可借上限 = 各商品設質金額 × LTV 加總。已借比例越高，擔保品能承受的跌幅越小。<\/div>\n    ${note}`;\n\n  // yield\n  const oldY=own>0?incOwn/own:0, int=L*rate, net=inc-int, newY=own>0?net/own:0;\n  $('oldY').textContent=pc(oldY);$('newY').textContent=pc(newY);\n  const d=newY-oldY;\n  $('deltaTxt').innerHTML=`淨殖利率${d>=0?'提高':'降低'} <b>${(Math.abs(d)*100).toFixed(2)}<\/b> 個百分點；年淨收益 <b>${f0(net)}<\/b>`;\n  $('levTxt').textContent=own>0?(mv/own).toFixed(2)+' 倍':'—';\n  $('monTxt').textContent=f0(net/12);\n  $('ownTxt').textContent=f0(own);\n  const by=borrowed>0?incB/borrowed:0, sp=by-rate;\n  $('spreadTxt').innerHTML=borrowed>0?`<span class=\"${sp<0?'neg':''}\">${(sp*100).toFixed(2)}%<\/span>`:'—';\n  $('incBody').innerHTML=`\n   <tr><td>自有資金商品配息<\/td><td>${f0(own)}<\/td><td>${f0(incOwn)}<\/td><td>${f0(incOwn/12)}<\/td><\/tr>\n   <tr><td>借款買入商品配息<\/td><td>${f0(borrowed)}<\/td><td>${f0(incB)}<\/td><td>${f0(incB/12)}<\/td><\/tr>\n   <tr><td>質押借款利息（${S.rate}%）<\/td><td>${f0(L)}<\/td><td class=\"neg\">−${f0(int)}<\/td><td class=\"neg\">−${f0(int/12)}<\/td><\/tr>\n   <tr class=\"total\"><td>淨收益<\/td><td>${f0(own)}<\/td><td>${f0(net)}<\/td><td>${f0(net/12)}<\/td><\/tr>`;\n\n  // stress\n  const k=1+s, Ts=T*k, Vs=V*k, us=Ts>0?L/Ts:(L>0?Infinity:0);\n  const cure=L>0&&Ts<=L?L-Ts:0, wLtv=V>0?T/V:0;\n  $('stressTxt').textContent=(s>0?'+':'')+(s*100).toFixed(0)+'%';\n  $('sV').textContent=f0(Vs);$('sT').textContent=f0(Ts);\n  $('sU').innerHTML=`<span class=\"${us>=1?'neg':''}\">${isFinite(us)?pc(us,1):'—'}<\/span>`;\n  $('sC').innerHTML=cure>0?`<span class=\"neg\">${f0(cure)}<\/span>`:'0';\n  $('sC2').innerHTML=cure>0&&wLtv>0?`<span class=\"neg\">${f0(cure/wLtv)}<\/span>`:'0';\n  save();\n}\n\nfunction init(){$('loan').value=f0(S.loan);$('rate').value=S.rate;renderLedger();update();}\ninit();\n<\/script>\n<\/body>\n<\/html>\n"}, {"key": "debt", "label": "負債試算", "full": "負債試算新版", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>結構化配置・報告產生器<\/title>\n<style>\n  :root{\n    --ink:#12161c; --ink2:#1d2531; --paper:#f6f3ec; --line:#d8d0c2;\n    --brass:#b08d57; --brass-d:#8f6f3e; --clay:#a8432e; --sage:#5f7d5c;\n    --muted:#6b6357; --panel:#eae4d7;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{\n    background:var(--paper); color:var(--ink);\n    font-family:\"Microsoft JhengHei\",\"PingFang TC\",\"Noto Sans TC\",\"Heiti TC\",sans-serif;\n    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;\n    line-height:1.5;\n  }\n  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}\n  h1{font-size:26px;font-weight:800;letter-spacing:.5px;margin:0 0 2px}\n  .sub{color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}\n  .brass{color:var(--brass-d)}\n\n  /* ---- input panel ---- */\n  .controls{\n    background:var(--ink); color:#efe9dc; border-radius:14px; padding:20px 22px;\n    display:grid; grid-template-columns:repeat(3,1fr); gap:16px 20px; margin-bottom:14px;\n  }\n  .controls h2{grid-column:1/-1;margin:0 0 2px;font-size:13px;letter-spacing:3px;color:var(--brass);font-weight:700}\n  .fld label{display:block;font-size:12px;color:#b9b1a2;margin-bottom:5px}\n  .fld .hint{font-size:11px;color:#7d766a;margin-top:4px;line-height:1.35}\n  .inputrow{display:flex;align-items:center;background:#0b0e13;border:1px solid #2a323f;border-radius:8px;overflow:hidden}\n  .inputrow input{\n    width:100%;border:0;background:transparent;color:#f6f3ec;font:inherit;\n    font-size:19px;font-weight:700;padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;\n  }\n  .inputrow input:focus{outline:none}\n  .inputrow .u{padding:0 11px;color:#8a8272;font-size:13px;white-space:nowrap;border-left:1px solid #2a323f}\n  .fixed{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;padding-top:4px;border-top:1px solid #2a323f;margin-top:2px}\n  .chip{background:#0b0e13;border:1px solid #2a323f;border-radius:20px;padding:5px 13px;font-size:12px;color:#c9c1b2}\n  .chip b{color:var(--brass)}\n  .actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}\n  .btn{border:1px solid var(--brass);background:transparent;color:var(--brass);border-radius:8px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer;font-weight:600}\n  .btn:hover{background:var(--brass);color:var(--ink)}\n  .btn.ghost{border-color:#3a4250;color:#b9b1a2}\n  .btn.ghost:hover{background:#0b0e13;color:#efe9dc}\n\n  /* ---- report ---- */\n  .rpt-title{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px}\n  .rpt-title .no{font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:5px;padding:3px 8px;letter-spacing:1px}\n  .rpt-title h3{margin:0;font-size:19px;font-weight:800}\n  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px}\n\n  .grid{display:grid;gap:14px}\n  .g4{grid-template-columns:repeat(4,1fr)}\n  .g3{grid-template-columns:repeat(3,1fr)}\n  .g2{grid-template-columns:repeat(2,1fr)}\n  .stat{background:var(--panel);border-radius:10px;padding:14px 16px}\n  .stat .k{font-size:12px;color:var(--muted);margin-bottom:6px}\n  .stat .v{font-size:24px;font-weight:800;line-height:1.1}\n  .stat .v small{font-size:13px;font-weight:600;color:var(--muted)}\n  .stat .note{font-size:11px;color:var(--muted);margin-top:5px}\n  .stat.dark{background:var(--ink);color:#f6f3ec}\n  .stat.dark .k{color:#b9b1a2}\n  .stat.dark .note{color:#8a8272}\n  .stat.gold{background:linear-gradient(135deg,#c6a568,#a8843f);color:#20170a}\n  .stat.gold .k{color:#4a3714}\n  .stat.gold .note{color:#4a3714}\n\n  /* core params */\n  .param{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}\n  .param:last-child{border-bottom:0}\n  .param .pct{font-size:30px;font-weight:800;min-width:120px}\n  .param .pct.up{color:var(--brass-d)} .param .pct.dn{color:var(--clay)} .param .pct.sp{color:var(--sage)} .param .pct.pl{color:var(--ink)}\n  .param .pmeta .t{font-weight:700} .param .pmeta .d{font-size:12px;color:var(--muted)}\n\n  /* cashflow */\n  .cf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}\n  .cf .yr{border:1px solid var(--line);border-radius:10px;padding:14px}\n  .cf .yr h4{margin:0 0 8px;font-size:14px;color:var(--ink2)}\n  .cf .line{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:#3a3a3a}\n  .cf .line .neg{color:var(--clay)}\n  .cf .gap{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:800;color:var(--clay);font-size:15px;text-align:right}\n  .cf .yr.y1{background:var(--panel)}\n  .cf .yr.y1 .fill{font-size:13px;color:var(--muted);margin-top:6px}\n  .insight{margin-top:14px;background:#fbf9f4;border-left:3px solid var(--brass);padding:11px 14px;font-size:13px;color:#4a4335;border-radius:0 8px 8px 0}\n  .insight b{color:var(--clay)}\n\n  /* structure diagram (01) */\n  .diag{width:100%;height:auto;display:block;max-width:920px;margin:0 auto}\n  .diag .dg-lbl{font-size:20px;fill:#c4cdda;font-weight:600}\n  .diag .dg-val{font-size:34px;font-weight:800;fill:#fff}\n  .diag .dg-sub{font-size:15px;fill:#9aa4b2}\n  .diag .dg-line{stroke:#98a1ae;stroke-width:2;fill:none}\n\n  /* waterfall */\n  .wf-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px 0}\n  .wf{display:flex;align-items:stretch;gap:4px;height:250px;min-width:430px}\n  .wf .col{flex:1;display:flex;flex-direction:column;min-width:0}\n  .wf .col.delta{flex:.65;justify-content:center;align-items:center}\n  .wf .track{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:0}\n  .wf .barlabel{font-size:12px;font-weight:800;white-space:nowrap;margin-bottom:4px;line-height:1.1;text-align:center;color:var(--ink)}\n  .wf .barlabel.green{color:var(--sage)}\n  .wf .bar{width:64%;border-radius:3px 3px 0 0;transition:height .35s ease}\n  .wf .bar.pos,.wf .bar.stable{background:var(--ink)}\n  .wf .bar.surplus{background:var(--sage)}\n  .wf .bar.capped{border-radius:0}\n  .wf .dchip{font-size:12px;font-weight:800;color:var(--clay);white-space:nowrap;background:#f7ede9;border-radius:5px;padding:3px 7px}\n  .wf .xlab{margin-top:8px;font-size:11px;color:var(--muted);text-align:center;line-height:1.3;min-height:32px}\n  .wf .xlab b{color:var(--ink);font-size:12px;display:block}\n\n  /* legacy scenarios */\n  .scn{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n  .scn .box{border:1px solid var(--line);border-radius:10px;padding:16px}\n  .scn .box.b{border-color:var(--brass);background:#fdfbf6}\n  .scn .box h4{margin:0 0 4px;font-size:15px}\n  .scn .box .assume{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.45}\n  .scn .big{font-size:15px;line-height:1.7}\n  .scn .big .amt{font-size:26px;font-weight:800;color:var(--ink)}\n  .scn .box.b .big .amt{color:var(--brass-d)}\n  .scn .yrline{display:flex;justify-content:space-between;font-size:13px;color:#4a4335;padding:3px 0}\n  .scn .formula{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;font-family:ui-monospace,\"Menlo\",monospace}\n\n  /* compare table */\n  table{width:100%;border-collapse:collapse;font-size:14px}\n  th,td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--line)}\n  th{background:var(--ink);color:#f6f3ec;font-weight:700;font-size:13px}\n  th:first-child,td:first-child{text-align:left;color:var(--muted)}\n  tbody tr:nth-child(even){background:#faf8f2}\n  td.hl{font-weight:800}\n  td.col-best{background:#fdf7ea!important}\n  th.col-best{background:var(--brass-d)!important;color:#fff!important}\n  tr.eff td{font-weight:800;color:var(--ink)}\n  tr.eff td.p1{color:var(--brass-d)} tr.eff td.p2{color:var(--clay)}\n\n  /* stacking (07) mini-inputs on light card */\n  .stk-in{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;background:var(--panel);border-radius:10px;padding:14px}\n  .stk-in .m label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}\n  .stk-in .m .box{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n  .stk-in .m input{width:100%;border:0;background:transparent;font:inherit;font-size:16px;font-weight:700;padding:8px 9px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}\n  .stk-in .m input:focus{outline:none}\n  .stk-in .m .u{padding:0 9px;color:var(--muted);font-size:12px;border-left:1px solid var(--line);white-space:nowrap}\n  .stk-warn{margin-top:12px;background:#fbecea;border-left:3px solid var(--clay);padding:10px 13px;font-size:12.5px;color:#7a2f22;border-radius:0 8px 8px 0}\n\n  .foot{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}\n  .foot b{color:var(--ink2)}\n\n  @media screen and (max-width:820px){\n    .controls,.g4,.g3,.g2,.cf,.scn{grid-template-columns:1fr}\n    .stk-in{grid-template-columns:1fr 1fr}\n    .wf{height:190px}\n  }\n  @media print{\n    @page{ size:A4 portrait; margin:11mm 10mm; }\n    html,body{background:#fff!important}\n    *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }\n    .controls,.actions,.no-print{display:none!important}\n\n    /* fit A4 width instead of 1180px screen width */\n    .wrap{ max-width:100%; width:100%; padding:0; margin:0 }\n    h1{font-size:18px;margin-top:0}\n    .sub{font-size:10px;letter-spacing:1.5px;margin-bottom:8px}\n\n    /* keep each section title glued to its card; never split a card */\n    .rpt-title{ margin:9px 0 5px; break-after:avoid; page-break-after:avoid }\n    .rpt-title .no{padding:2px 6px}\n    .rpt-title h3{font-size:15px}\n    .card{ border-color:#ccc; padding:12px 14px; break-inside:avoid; page-break-inside:avoid }\n\n    /* tighten components so everything fits the A4 column */\n    .grid{gap:8px}\n    .stat{padding:9px 11px;border-radius:8px}\n    .stat .k{font-size:10px;margin-bottom:3px}\n    .stat .v{font-size:16px}\n    .stat .v small{font-size:10px}\n    .stat .note{font-size:9px;margin-top:3px}\n\n    .param{padding:7px 2px}\n    .param .pct{font-size:21px;min-width:74px}\n    .param .pmeta .t{font-size:12px}\n    .param .pmeta .d{font-size:9.5px}\n\n    .cf{gap:8px}\n    .cf .yr{padding:9px}\n    .cf .yr h4{font-size:12px}\n    .cf .line{font-size:10.5px}\n    .cf .gap{font-size:12px}\n    .cf .yr.y1 .fill{font-size:9.5px}\n    .insight{font-size:10px;padding:8px 10px}\n\n    .wf{height:150px;padding-top:16px}\n    .wf .lbl{font-size:9.5px}\n    .wf .xlab{font-size:8.5px}\n    .wf .bar{transition:none}\n\n    .scn{gap:10px}\n    .scn .box{padding:11px}\n    .scn .box h4{font-size:12px}\n    .scn .box .assume{font-size:9.5px;margin-bottom:8px}\n    .scn .big{font-size:11px}\n    .scn .big .amt{font-size:18px}\n    .scn .yrline{font-size:10.5px}\n    .scn .formula{font-size:8.5px}\n\n    table{font-size:10.5px}\n    th,td{padding:6px 6px}\n    th{font-size:10.5px}\n\n    .foot{font-size:9px;line-height:1.5;margin-top:12px;break-inside:avoid;page-break-inside:avoid}\n\n    /* pagination: 01+02 / 03+04 / 05+06 → three clean pages */\n    #pg2{ break-before:page; page-break-before:always }\n    #pg3{ break-before:page; page-break-before:always }\n    #pg4{ break-before:page; page-break-before:always }\n    .stk-in{display:none}\n  }\n  @media(prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/
