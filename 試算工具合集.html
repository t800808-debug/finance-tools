style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <h1>結構化配置・<span class=\"brass\">報告產生器<\/span><\/h1>\n  <div class=\"sub\">Premium Financing &nbsp;/&nbsp; 舉債投保槓桿架構<\/div>\n\n  <!-- ============ INPUTS ============ -->\n  <div class=\"controls\">\n    <h2>客戶參數（可調整）<\/h2>\n\n    <div class=\"fld\">\n      <label>① 投資本金<\/label>\n      <div class=\"inputrow\"><input id=\"P\" type=\"number\" step=\"100\" value=\"3000\"><span class=\"u\">萬<\/span><\/div>\n    <\/div>\n    <div class=\"fld\">\n      <label>② 銀行融資金額<\/label>\n      <div class=\"inputrow\"><input id=\"L\" type=\"number\" step=\"100\" value=\"2000\"><span class=\"u\">萬<\/span><\/div>\n    <\/div>\n    <div class=\"fld\">\n      <label>⑤ 保障倍數（相對融資額）<\/label>\n      <div class=\"inputrow\"><input id=\"K\" type=\"number\" step=\"0.01\" value=\"3.99\"><span class=\"u\">倍<\/span><\/div>\n      <div class=\"hint\">身故理賠金 = 保障倍數 × 融資額<\/div>\n    <\/div>\n\n    <div class=\"fld\">\n      <label>投資預期報酬率<\/label>\n      <div class=\"inputrow\"><input id=\"RINV\" type=\"number\" step=\"0.1\" value=\"7\"><span class=\"u\">%<\/span><\/div>\n      <div class=\"hint\">利差空間 = 投資報酬 − 融資利率<\/div>\n    <\/div>\n    <div class=\"fld\">\n      <label>融資利率（還息不還本）<\/label>\n      <div class=\"inputrow\"><input id=\"RLOAN\" type=\"number\" step=\"0.1\" value=\"2\"><span class=\"u\">%<\/span><\/div>\n    <\/div>\n    <div class=\"fld\">\n      <label>③ 每期保費（自動 = 融資 ÷ 3，可手動改）<\/label>\n      <div class=\"inputrow\"><input id=\"PREM\" type=\"number\" step=\"1\" value=\"\"><span class=\"u\">萬 ×3年<\/span><\/div>\n      <div class=\"hint\">留白＝自動套用 1/3 規則。輸入 <b>700<\/b> 可完全對齊原始簡報。<\/div>\n    <\/div>\n    <div class=\"fld\">\n      <label>情境B 配息再投資報酬<\/label>\n      <div class=\"inputrow\"><input id=\"REINV\" type=\"number\" step=\"0.5\" value=\"5\"><span class=\"u\">%<\/span><\/div>\n    <\/div>\n\n    <div class=\"fixed\">\n      <span class=\"chip\">遺產稅率 <b>20%<\/b><\/span>\n      <span class=\"chip\">保費繳費 <b>3 年<\/b><\/span>\n      <span class=\"chip\">初始資金 = 本金 + 一期保費<\/span>\n    <\/div>\n\n    <div class=\"actions\">\n      <button class=\"btn\" onclick=\"window.print()\">列印 / 匯出 PDF<\/button>\n      <button class=\"btn ghost\" onclick=\"loadDeck()\">帶入原始簡報數字<\/button>\n      <button class=\"btn ghost\" onclick=\"resetAll()\">清空重填<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- ============ REPORT ============ -->\n\n  <!-- 1 -->\n  <div class=\"rpt-title\"><span class=\"no\">01<\/span><h3 id=\"t1\">初始資金的結構化配置<\/h3><\/div>\n  <div class=\"card\">\n    <svg class=\"diag\" viewBox=\"0 0 960 540\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"資金結構流程圖\">\n      <defs>\n        <linearGradient id=\"gold\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n          <stop offset=\"0\" stop-color=\"#cbaa6b\"/>\n          <stop offset=\"1\" stop-color=\"#a5823f\"/>\n        <\/linearGradient>\n      <\/defs>\n\n      <!-- connectors -->\n      <path class=\"dg-line\" d=\"M180,270 L240,270 M240,97 L240,427 M240,97 L300,97 M240,232 L300,232 M240,427 L300,427\"/>\n      <path class=\"dg-line\" d=\"M510,97 L580,97 M510,232 L580,232 M580,97 L580,232 M580,165 L650,165\"/>\n      <!-- gold block arrow 首期保費 → 身故理賠金 -->\n      <path d=\"M515,412 L610,412 L610,396 L648,430 L610,464 L610,448 L515,448 Z\" fill=\"url(#gold)\"/>\n\n      <!-- boxes -->\n      <g>\n        <rect x=\"10\"  y=\"195\" width=\"170\" height=\"150\" rx=\"6\" fill=\"#1b2431\"/>\n        <text class=\"dg-lbl\" x=\"95\"  y=\"258\" text-anchor=\"middle\">初始資金<\/text>\n        <text class=\"dg-val\" x=\"95\"  y=\"300\" text-anchor=\"middle\" id=\"d_init\">3,700萬<\/text>\n\n        <rect x=\"300\" y=\"40\"  width=\"210\" height=\"115\" rx=\"6\" fill=\"#2c303b\"/>\n        <text class=\"dg-lbl\" x=\"405\" y=\"90\"  text-anchor=\"middle\">投資本金<\/text>\n        <text class=\"dg-val\" x=\"405\" y=\"130\" text-anchor=\"middle\" id=\"d_p\">3,000萬<\/text>\n\n        <rect x=\"300\" y=\"175\" width=\"210\" height=\"115\" rx=\"6\" fill=\"#586070\"/>\n        <text class=\"dg-lbl\" x=\"405\" y=\"225\" text-anchor=\"middle\" fill=\"#eef1f5\">銀行融資<\/text>\n        <text class=\"dg-val\" x=\"405\" y=\"265\" text-anchor=\"middle\" id=\"d_l\">2,000萬<\/text>\n\n        <rect x=\"650\" y=\"70\"  width=\"290\" height=\"190\" rx=\"6\" fill=\"#18202f\"/>\n        <text class=\"dg-lbl\" x=\"795\" y=\"132\" text-anchor=\"middle\">總投資部位<\/text>\n        <text class=\"dg-val\" x=\"795\" y=\"180\" text-anchor=\"middle\" id=\"d_pos\">5,000萬<\/text>\n        <text class=\"dg-sub\" x=\"795\" y=\"214\" text-anchor=\"middle\">投資本金＋銀行融資<\/text>\n\n        <rect x=\"300\" y=\"370\" width=\"210\" height=\"115\" rx=\"6\" fill=\"#101a2b\"/>\n        <text class=\"dg-lbl\" x=\"405\" y=\"420\" text-anchor=\"middle\">首期保費<\/text>\n        <text class=\"dg-val\" x=\"405\" y=\"460\" text-anchor=\"middle\" id=\"d_prem\">700萬<\/text>\n\n        <rect x=\"650\" y=\"350\" width=\"290\" height=\"160\" rx=\"6\" fill=\"url(#gold)\"/>\n        <text class=\"dg-lbl\" x=\"795\" y=\"418\" text-anchor=\"middle\" fill=\"#2c2109\">身故理賠金<\/text>\n        <text class=\"dg-val\" x=\"795\" y=\"464\" text-anchor=\"middle\" fill=\"#20180a\" id=\"d_db\">7,980萬<\/text>\n      <\/g>\n    <\/svg>\n\n    <div class=\"grid g3\" style=\"margin-top:16px\">\n      <div class=\"stat\"><div class=\"k\">抵押率 (LTV)<\/div><div class=\"v\" id=\"s_ltv\"><\/div><div class=\"note\" id=\"s_ltv_n\"><\/div><\/div>\n      <div class=\"stat\"><div class=\"k\">槓桿保障<\/div><div class=\"v\" id=\"s_lev\"><\/div><div class=\"note\" id=\"s_lev_n\"><\/div><\/div>\n      <div class=\"stat\"><div class=\"k\">保費架構<\/div><div class=\"v\" id=\"s_premstruct\"><\/div><div class=\"note\" id=\"s_tprem_n\"><\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 2 -->\n  <div class=\"rpt-title\"><span class=\"no\">02<\/span><h3>驅動架構運行的四大核心參數<\/h3><\/div>\n  <div class=\"card\">\n    <div class=\"grid g2\">\n      <div>\n        <div class=\"param\"><div class=\"pct up\" id=\"p_rinv\">7%<\/div><div class=\"pmeta\"><div class=\"t\">投資預期收益<\/div><div class=\"d\" id=\"p_div\"><\/div><\/div><\/div>\n        <div class=\"param\"><div class=\"pct sp\" id=\"p_spr_pct\">5%<\/div><div class=\"pmeta\"><div class=\"t\">初始利差空間<\/div><div class=\"d\" id=\"p_spread\"><\/div><\/div><\/div>\n      <\/div>\n      <div>\n        <div class=\"param\"><div class=\"pct dn\" id=\"p_rloan\">2%<\/div><div class=\"pmeta\"><div class=\"t\">融資資金成本<\/div><div class=\"d\" id=\"p_int\"><\/div><\/div><\/div>\n        <div class=\"param\"><div class=\"pct pl\" id=\"p_prem_v\"><\/div><div class=\"pmeta\"><div class=\"t\">保單建構成本<\/div><div class=\"d\" id=\"p_prem\"><\/div><\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 3 -->\n  <div class=\"rpt-title\" id=\"pg2\"><span class=\"no\">03<\/span><h3>精確校準後：前三年現金流如何調整<\/h3><\/div>\n  <div class=\"card\">\n    <div class=\"cf\">\n      <div class=\"yr y1\">\n        <h4>第一年<\/h4>\n        <div class=\"line\"><span>首期保費<\/span><span id=\"cf_y1p\"><\/span><\/div>\n        <div class=\"fill\">保費已由初始資金（帳上預留）支付，投資部位不動。<\/div>\n      <\/div>\n      <div class=\"yr\">\n        <h4>第二年<\/h4>\n        <div class=\"line\"><span>配息<\/span><span id=\"cf_y2d\"><\/span><\/div>\n        <div class=\"line\"><span>利息<\/span><span class=\"neg\" id=\"cf_y2i\"><\/span><\/div>\n        <div class=\"line\"><span>保費<\/span><span class=\"neg\" id=\"cf_y2p\"><\/span><\/div>\n        <div class=\"gap\" id=\"cf_y2g\"><\/div>\n      <\/div>\n      <div class=\"yr\">\n        <h4>第三年<\/h4>\n        <div class=\"line\"><span>配息（本金下降）<\/span><span id=\"cf_y3d\"><\/span><\/div>\n        <div class=\"line\"><span>利息<\/span><span class=\"neg\" id=\"cf_y3i\"><\/span><\/div>\n        <div class=\"line\"><span>保費<\/span><span class=\"neg\" id=\"cf_y3p\"><\/span><\/div>\n        <div class=\"gap\" id=\"cf_y3g\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"insight\">💡 <b>私人財管洞察：<\/b>若無額外預留現金，前兩年缺口會以「贖回投資本金」支應保費，使投資部位逐年下降。<\/div>\n  <\/div>\n\n  <!-- 4 -->\n  <div class=\"rpt-title\"><span class=\"no\">04<\/span><h3>投資本金調整軌跡與第四年後的穩定現金流<\/h3><\/div>\n  <div class=\"card\">\n    <div class=\"wf-scroll\"><div class=\"wf\" id=\"wf\"><\/div><\/div>\n    <div class=\"insight\">💡 挺過前三年的現金流陣痛期後，本金穩定在 <b id=\"wf_stable\" style=\"color:var(--ink)\"><\/b>，並開始每年產生 <b id=\"wf_surplus\" style=\"color:var(--sage)\"><\/b> 的正向現金流（配息 − 利息，保費已繳完）。<\/div>\n  <\/div>\n\n  <!-- 5 -->\n  <div class=\"rpt-title\" id=\"pg3\"><span class=\"no\">05<\/span><h3>資產傳承終值推演：靜態維持 vs 複利滾存<\/h3><\/div>\n  <div class=\"card\">\n    <div class=\"scn\">\n      <div class=\"box\">\n        <h4>情境 A：資產不增長（每年花掉配息）<\/h4>\n        <div class=\"assume\" id=\"a_assume\"><\/div>\n        <div class=\"big\">10 / 20 年 稅後繼承<br><span class=\"amt\" id=\"a_val\"><\/span><\/div>\n        <div class=\"formula\" id=\"a_f\"><\/div>\n      <\/div>\n      <div class=\"box b\">\n        <h4>情境 B：盈餘持續滾入（配息再投資）<\/h4>\n        <div class=\"assume\" id=\"b_assume\"><\/div>\n        <div class=\"yrline\"><span>第 10 年 稅後繼承<\/span><span class=\"hl\" id=\"b_10\"><\/span><\/div>\n        <div class=\"yrline\"><span>第 20 年 稅後繼承<\/span><span class=\"hl\" id=\"b_20\"><\/span><\/div>\n        <div class=\"formula\" id=\"b_f\"><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 6 -->\n  <div class=\"rpt-title\"><span class=\"no\">06<\/span><h3>三種路徑・三種終點：最終成果對比<\/h3><\/div>\n  <div class=\"card\">\n    <table>\n      <thead><tr><th>比較項目<\/th><th>不規劃<\/th><th>方案1：每年花掉配息<\/th><th class=\"col-best\">方案2：配息再投資<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>投資部位<\/td><td id=\"c_pos0\"><\/td><td id=\"c_pos1\"><\/td><td class=\"col-best\" id=\"c_pos2\"><\/td><\/tr>\n        <tr><td>銀行負債<\/td><td>0<\/td><td id=\"c_l1\"><\/td><td class=\"col-best\" id=\"c_l2\"><\/td><\/tr>\n        <tr><td>生前年領金流<\/td><td id=\"c_inc0\"><\/td><td class=\"hl\" id=\"c_inc1\"><\/td><td class=\"col-best hl\" id=\"c_inc2\"><\/td><\/tr>\n        <tr><td>子女稅後繼承（10年）<\/td><td id=\"c_i10_0\"><\/td><td id=\"c_i10_1\"><\/td><td class=\"col-best\" id=\"c_i10_2\"><\/td><\/tr>\n        <tr><td>子女稅後繼承（20年）<\/td><td id=\"c_i20_0\"><\/td><td id=\"c_i20_1\"><\/td><td class=\"col-best\" id=\"c_i20_2\"><\/td><\/tr>\n        <tr class=\"eff\"><td>最高資產傳承效益<\/td><td>基準 100%<\/td><td class=\"p1\" id=\"c_e1\"><\/td><td class=\"col-best p2\" id=\"c_e2\"><\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <div class=\"insight\" style=\"margin-top:16px\">💡 「生前年領金流」採用<b style=\"color:var(--ink)\">第4年後可長期持續的淨現金流<\/b>（配息−利息）。原始簡報以「初始利差 <span id=\"c_spread_head\"><\/span>」作為標題數字；本表以陣痛期後實際可持續金額為準，較符合合規揭露原則。<\/div>\n  <\/div>\n\n  <!-- 7 -->\n  <div class=\"rpt-title\" id=\"pg4\"><span class=\"no\">07<\/span><h3>疊保單試算：保單質借再投保的傳承增益<\/h3><\/div>\n  <div class=\"card\">\n    <div class=\"stk-in no-print\">\n      <div class=\"m\"><label>質借成數（對總繳保費）<\/label><div class=\"box\"><input id=\"Q\" type=\"number\" step=\"1\" value=\"60\"><span class=\"u\">%<\/span><\/div><\/div>\n      <div class=\"m\"><label>疊加層數<\/label><div class=\"box\"><input id=\"NLAYER\" type=\"number\" step=\"1\" value=\"2\"><span class=\"u\">層<\/span><\/div><\/div>\n      <div class=\"m\"><label>疊加層保障倍數（留白＝同主倍數）<\/label><div class=\"box\"><input id=\"K2\" type=\"number\" step=\"0.01\" value=\"\"><span class=\"u\">倍<\/span><\/div><\/div>\n      <div class=\"m\"><label>質借利率（還息不還本）<\/label><div class=\"box\"><input id=\"RP\" type=\"number\" step=\"0.1\" value=\"2\"><span class=\"u\">%<\/span><\/div><\/div>\n    <\/div>\n\n    <table>\n      <thead><tr><th>層級<\/th><th>質借金額 = 該層總繳保費<\/th><th>新增保額（免稅）<\/th><th>累計質借負債<\/th><\/tr><\/thead>\n      <tbody id=\"stk_rows\"><\/tbody>\n    <\/table>\n\n    <div class=\"grid g4\" style=\"margin-top:14px\">\n      <div class=\"stat dark\"><div class=\"k\">疊加後總保額（免稅）<\/div><div class=\"v\" id=\"stk_db\"><\/div><div class=\"note\" id=\"stk_db_n\"><\/div><\/div>\n      <div class=\"stat\"><div class=\"k\">新增質借負債<\/div><div class=\"v\" id=\"stk_debt\"><\/div><div class=\"note\">身故時由保險金扣還<\/div><\/div>\n      <div class=\"stat\"><div class=\"k\">每年新增利息成本<\/div><div class=\"v\" id=\"stk_int\"><\/div><div class=\"note\" id=\"stk_int_n\"><\/div><\/div>\n      <div class=\"stat gold\"><div class=\"k\">傳承淨增益<\/div><div class=\"v\" id=\"stk_gain\"><\/div><div class=\"note\">保額增額 − 質借本金<\/div><\/div>\n    <\/div>\n\n    <div class=\"scn\" style=\"margin-top:16px\">\n      <div class=\"box\">\n        <h4>情境 A（每年花掉配息）稅後繼承<\/h4>\n        <div class=\"big\"><span id=\"stk_a_before\" style=\"color:var(--muted)\"><\/span> ➜ <span class=\"amt\" id=\"stk_a_after\"><\/span><\/div>\n        <div class=\"yrline\"><span>疊保單增益<\/span><span class=\"hl\" id=\"stk_a_delta\" style=\"color:var(--brass-d)\"><\/span><\/div>\n      <\/div>\n      <div class=\"box b\">\n        <h4>情境 B（配息再投資・20年）稅後繼承<\/h4>\n        <div class=\"big\"><span id=\"stk_b_before\" style=\"color:var(--muted)\"><\/span> ➜ <span class=\"amt\" id=\"stk_b_after\"><\/span><\/div>\n        <div class=\"yrline\"><span>疊保單增益（已扣再投資縮減）<\/span><span class=\"hl\" id=\"stk_b_delta\" style=\"color:var(--clay)\"><\/span><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"insight\" style=\"margin-top:14px\">💡 生前年領金流因質借利息由 <b id=\"stk_inc_before\" style=\"color:var(--ink)\"><\/b> 調整為 <b id=\"stk_inc_after\" style=\"color:var(--ink)\"><\/b>，差額即為此策略的年持有成本。<\/div>\n    <div class=\"stk-warn\" id=\"stk_warn\" style=\"display:none\"><\/div>\n\n    <div class=\"foot\" style=\"margin-top:14px\">\n      <b>疊保單假設與提醒<\/b>　本層試算為說明性示意。①「疊加層」與主約同為<b>分年繳（3 年）<\/b>，故沿用相同保障倍數屬合理；惟各層須俟前一層保價金足額後方能質借建構，實務上為<b>逐層、跨數年循環<\/b>建立，完整保額須數年後始到位（層數愈多、到位愈晚，短年期繼承可能尚未建置完成）。②質借利率多為<b>浮動<\/b>且常高於保費融資利率，升息會壓縮甚至消滅利差。③本試算假設質借本金於身故時由各層保險金全額扣還、利息還息不還本，且質借額度以各層總繳保費計算。④層層舉債放大槓桿的同時亦放大流動性與利率風險，且可能觸發<b>實質課稅（實質重於形式）<\/b>對「舉債投保／鉅額保單」的核課，務必保留完整風險揭露並以個案稅務與核保條件為準。\n    <\/div>\n  <\/div>\n    <b>假設與揭露<\/b>　本試算為說明性示意，非保證收益。固定假設：投資報酬 7%、融資利率 2%（還息不還本）、保費繳費 3 年、第一年保費由初始資金預留支付。情境B 再投資採「年初投入」複利（annuity due）以對齊原始簡報；配息再投資報酬預設 5%，可調整。<br>\n    <b>合規提醒<\/b>　舉債投保／保費融資涉及「投資型商品適合度、融資成數與利率變動、外幣匯率、實質課稅（實質重於形式）與遺產稅認定、境外保單資格與 FSC 核准」等風險，實際製作客戶文件時務必保留完整風險揭露，勿僅呈現正向情境。稅率、免稅額與商品條件應以最新法規與核准條款為準。\n  <\/div>\n\n<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst PREM_YEARS = 3;\n\n// number -> \"1,234\" or with decimals when needed\nfunction n(v, dp){\n  if(dp===undefined) dp = (Math.abs(v%1)>0.05 ? 1 : 0);\n  return Number(v.toFixed(dp)).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});\n}\nconst w  = (v,dp)=> n(v,dp)+' 萬';\n// large amount: show 億 if >= 10000萬\nfunction big(v){\n  if(Math.abs(v) >= 10000){ return n(v/10000,2)+' 億'; }\n  return n(v,0)+' 萬';\n}\n// annuity-due future value factor\nfunction fvDue(g,nn){ return ((Math.pow(1+g,nn)-1)/g)*(1+g); }\n\nfunction calc(){\n  const P = +$('P').value || 0;\n  const L = +$('L').value || 0;\n  const K = +$('K').value || 0;\n  const tax = 0.20;                          // 固定 20%\n  const g   = (+$('REINV').value || 0)/100;\n  const R_INV  = (+$('RINV').value  || 0)/100;\n  const R_LOAN = (+$('RLOAN').value || 0)/100;\n  let prem  = $('PREM').value.trim()==='' ? L/PREM_YEARS : +$('PREM').value;\n\n  // derived\n  const totalPrem = prem * PREM_YEARS;\n  const initCap   = P + prem;\n  const pos0      = P + L;\n  const DB        = K * L;\n  const interest  = R_LOAN * L;\n  const ltv       = P>0 ? L/P*100 : 0;\n\n  // ---- 3-year trajectory ----\n  // Y1: reserve pays premium, position unchanged\n  const y2div = R_INV*pos0;\n  const y2net = y2div - interest - prem;   // negative gap\n  const pos2  = pos0 + y2net;\n  const y3div = R_INV*pos2;\n  const y3net = y3div - interest - prem;\n  const pos3  = pos2 + y3net;              // stable position\n  const surplus = R_INV*pos3 - interest;  // year 4+ sustainable net\n  const spread0 = y2div - interest;       // initial gross spread (headline)\n\n  // ---- inheritance ----\n  const netAssets = pos3 - L;\n  const inhNo   = initCap * (1-tax);                 // 不規劃\n  const incNo   = R_INV * initCap;\n  const inhA    = netAssets*(1-tax) + DB;            // 方案1 (10=20)\n  const acc10   = surplus * fvDue(g,10);\n  const acc20   = surplus * fvDue(g,20);\n  const inhB10  = (netAssets+acc10)*(1-tax) + DB;\n  const inhB20  = (netAssets+acc20)*(1-tax) + DB;\n  const eff1    = inhNo>0 ? inhA/inhNo*100 : 0;\n  const eff2    = inhNo>0 ? inhB20/inhNo*100 : 0;\n\n  // ================= RENDER =================\n  $('t1').textContent = `初始資金 ${n(initCap,0)} 萬的結構化配置`;\n\n  // structure diagram (01)\n  $('d_init').textContent = n(initCap,0)+'萬';\n  $('d_p').textContent    = n(P,0)+'萬';\n  $('d_l').textContent    = n(L,0)+'萬';\n  $('d_pos').textContent  = n(pos0,0)+'萬';\n  $('d_prem').textContent = n(prem,0)+'萬';\n  $('d_db').textContent   = n(DB,0)+'萬';\n  $('s_ltv').textContent      = n(ltv,1)+'%';\n  $('s_ltv_n').textContent    = ltv<=70 ? '處於安全區間' : '偏高，注意追繳風險';\n  $('s_lev').innerHTML        = n(DB/L,2)+' <small>倍<\/small>';\n  $('s_lev_n').textContent    = '總保額 '+n(DB,0)+' 萬';\n  $('s_premstruct').innerHTML = n(prem,0)+' <small>萬 × 3年<\/small>';\n  $('s_tprem_n').textContent  = '總保費 '+n(totalPrem,0)+' 萬';\n\n  // params\n  $('p_rinv').textContent    = n(R_INV*100)+'%';\n  $('p_rloan').textContent   = n(R_LOAN*100)+'%';\n  $('p_spr_pct').textContent = n((R_INV-R_LOAN)*100)+'%';\n  $('p_div').textContent   = `配息型標的，年收益約 ${n(y2div,0)} 萬（${n(R_INV*100)}% × 總部位）`;\n  $('p_int').textContent   = `還息不還本，年支出約 ${n(interest,0)} 萬（${n(R_LOAN*100)}% × 融資）`;\n  $('p_spread').textContent= `初始每年套利淨額約 ${n(spread0,0)} 萬（配息 − 利息）`;\n  $('p_prem_v').textContent= n(prem,0);\n  $('p_prem').textContent  = `萬 × 3 年（總保費 ${n(totalPrem,0)} 萬）`;\n\n  // cashflow\n  $('cf_y1p').textContent = '−'+n(prem,0)+' 萬';\n  $('cf_y2d').textContent = n(y2div,0)+' 萬';\n  $('cf_y2i').textContent = '−'+n(interest,0)+' 萬';\n  $('cf_y2p').textContent = '−'+n(prem,0)+' 萬';\n  $('cf_y2g').textContent = '= '+n(y2net,0)+' 萬（資金缺口）';\n  $('cf_y3d').textContent = n(y3div,1)+' 萬';\n  $('cf_y3i').textContent = '−'+n(interest,0)+' 萬';\n  $('cf_y3p').textContent = '−'+n(prem,0)+' 萬';\n  $('cf_y3g').textContent = '= '+n(y3net,1)+' 萬（資金缺口）';\n\n  // waterfall — robust flex layout (label sits above each bar; no absolute positioning)\n  const maxV = pos0;\n  const SF = 82;                       // tallest bar = 82% of track, leaving room for labels\n  const hp = v => (v/maxV*SF).toFixed(2)+'%';\n  const bar   = (v,cls,lbl) => `<div class=\"col\"><div class=\"track\"><div class=\"barlabel\">${lbl}<\/div><div class=\"bar ${cls}\" style=\"height:${hp(v)}\"><\/div><\/div><div class=\"xlab\"><b>{X1}<\/b>{X2}<\/div><\/div>`;\n  const delta = txt => `<div class=\"col delta\"><div class=\"dchip\">${txt}<\/div><\/div>`;\n  const fill  = (t,x1,x2) => t.replace('{X1}',x1).replace('{X2}', x2?x2:'');\n\n  let html = '';\n  html += fill(bar(pos0,'pos', n(pos0,0)+'萬'), '期初投資總額', '');\n  html += delta(n(y2net,0)+'萬');\n  html += fill(bar(pos2,'pos', n(pos2,0)+'萬'), '第2年末淨額', '(贖回支應保費)');\n  html += delta(n(y3net,1)+'萬');\n  html += fill(bar(pos3,'stable', n(pos3,1)+'萬'), '第3年末淨額', '(再次贖回)');\n  // stable + surplus stacked column\n  html += `<div class=\"col\"><div class=\"track\">`\n        + `<div class=\"barlabel green\">+${n(surplus,1)}萬<\/div>`\n        + `<div class=\"bar surplus\" style=\"height:${hp(surplus)}\"><\/div>`\n        + `<div class=\"bar stable capped\" style=\"height:${hp(pos3)}\"><\/div>`\n        + `<\/div><div class=\"xlab\"><b>第4年起（穩定）<\/b>年淨盈餘<\/div><\/div>`;\n  $('wf').innerHTML = html;\n  $('wf_stable').textContent  = n(pos3,1)+' 萬';\n  $('wf_surplus').textContent = n(surplus,1)+' 萬';\n\n  // scenario A / B\n  $('a_assume').innerHTML = `假設第4年起盈餘不再投入，僅維持 ${n(pos3,0)} 萬部位。<br>（${n(pos3,0)} 資產 − ${n(L,0)} 負債 = <b style=\"color:var(--clay)\">淨資產 ${n(netAssets,0)} 萬<\/b>）`;\n  $('a_val').textContent  = big(inhA);\n  $('a_f').textContent    = `(${n(netAssets,0)}萬 × ${n((1-tax)*100,0)}%) + ${n(DB,0)}萬 免稅保險金`;\n  $('b_assume').innerHTML = `假設部位不動，年淨盈餘 ${n(surplus,0)} 萬持續投入 ${n(g*100,1)}% 複利標的。<br>第10年增至 ${n(acc10,0)} 萬・第20年增至 ${n(acc20,0)} 萬。`;\n  $('b_10').textContent   = big(inhB10);\n  $('b_20').textContent   = big(inhB20);\n  $('b_f').innerHTML      = `(${n(netAssets,0)}+${n(acc10,0)})×${n((1-tax)*100,0)}% + ${n(DB,0)}萬保險金<br>(${n(netAssets,0)}+${n(acc20,0)})×${n((1-tax)*100,0)}% + ${n(DB,0)}萬保險金`;\n\n  // compare table\n  $('c_pos0').textContent = w(initCap);   // 不規劃 全額投入\n  $('c_pos1').textContent = w(P);\n  $('c_pos2').textContent = w(P);\n  $('c_l1').textContent   = w(L);\n  $('c_l2').textContent   = w(L);\n  $('c_inc0').textContent = w(incNo);\n  $('c_inc1').textContent = '💰 '+w(surplus);\n  $('c_inc2').textContent = w(surplus);\n  $('c_i10_0').textContent= big(inhNo);\n  $('c_i10_1').textContent= big(inhA);\n  $('c_i10_2').textContent= big(inhB10);\n  $('c_i20_0').textContent= big(inhNo);\n  $('c_i20_1').textContent= big(inhA);\n  $('c_i20_2').textContent= big(inhB20);\n  $('c_e1').textContent   = n(eff1,0)+'%';\n  $('c_e2').textContent   = n(eff2,0)+'%';\n  $('c_spread_head').textContent = n(spread0,0)+' 萬';\n\n  // ===== 07 疊保單（保單質借再投保） =====\n  const q  = Math.max(0,(+$('Q').value||0)/100);\n  const nL = Math.max(0, Math.floor(+$('NLAYER').value||0));\n  const k2 = $('K2').value.trim()==='' ? K : (+$('K2').value||0);\n  const rp = Math.max(0,(+$('RP').value||0)/100);\n  $('K2').placeholder = n(K,2)+'（同主倍數）';\n\n  let rows='', B=[], DBadd=[], cumDebt=0, prevTP=totalPrem;\n  for(let j=1;j<=nL;j++){\n    const b = q*prevTP, db = k2*b;\n    cumDebt += b; B.push(b); DBadd.push(db);\n    rows += `<tr><td>第 ${j+1} 層<\/td><td>${w(b)}<\/td><td class=\"hl\">${w(db)}<\/td><td>${w(cumDebt)}<\/td><\/tr>`;\n    prevTP = b;\n  }\n  if(nL===0) rows = `<tr><td colspan=\"4\" style=\"text-align:center;color:var(--muted)\">將「疊加層數」設為 1 以上即可試算<\/td><\/tr>`;\n  $('stk_rows').innerHTML = rows;\n\n  const sumB      = B.reduce((a,c)=>a+c,0);\n  const sumDBadd  = DBadd.reduce((a,c)=>a+c,0);\n  const totalDB   = DB + sumDBadd;\n  const annualInt = sumB * rp;\n  const gain      = sumDBadd - sumB;                 // 情境A 傳承淨增益（利息不影響繼承本金）\n  const inhA_stk  = inhA + gain;\n  const surplus_stk = surplus - annualInt;           // 情境B：利息由年盈餘支應→再投資縮減\n  const acc20_stk   = Math.max(0,surplus_stk) * fvDue(g,20);\n  const inhB20_stk  = (netAssets + acc20_stk)*(1-tax) + totalDB - sumB;\n  const deltaB      = inhB20_stk - inhB20;\n\n  $('stk_db').textContent    = big(totalDB);\n  $('stk_db_n').textContent  = `基礎 ${n(DB,0)} ＋ 疊加 ${n(sumDBadd,0)} 萬`;\n  $('stk_debt').textContent  = big(sumB);\n  $('stk_int').textContent   = w(annualInt);\n  $('stk_int_n').textContent = `${n(sumB,0)}萬 × ${n(rp*100,1)}%`;\n  $('stk_gain').textContent  = big(gain);\n  $('stk_a_before').textContent = big(inhA);\n  $('stk_a_after').textContent  = big(inhA_stk);\n  $('stk_a_delta').textContent  = '＋'+big(gain);\n  $('stk_b_before').textContent = big(inhB20);\n  $('stk_b_after').textContent  = big(inhB20_stk);\n  $('stk_b_delta').textContent  = (deltaB>=0?'＋':'')+big(deltaB);\n  $('stk_inc_before').textContent = n(surplus,1)+' 萬';\n  $('stk_inc_after').textContent  = n(surplus_stk,1)+' 萬';\n\n  let warn='';\n  if(nL>0 && surplus_stk < 0)      warn = `⚠ 質借年利息 ${n(annualInt,0)} 萬 已超過穩定期年淨盈餘 ${n(surplus,1)} 萬 → 穩定期即為<b>負現金流<\/b>，須以外部資金補足利息，流動性風險高。`;\n  else if(nL>0 && (R_INV-rp) <= 0) warn = `⚠ 質借利率已 ≥ 投資報酬率，疊加層利差為負，槓桿放大的是風險而非報酬。`;\n  $('stk_warn').style.display = warn ? 'block' : 'none';\n  if(warn) $('stk_warn').innerHTML = warn;\n}\n\n// premium placeholder follows L when field is empty\nfunction syncPremPlaceholder(){\n  const L = +$('L').value || 0;\n  $('PREM').placeholder = n(L/PREM_YEARS,1)+'（自動）';\n}\n\n['P','L','K','RINV','RLOAN','REINV','PREM','Q','NLAYER','K2','RP'].forEach(id=>{\n  $(id).addEventListener('input', ()=>{ syncPremPlaceholder(); calc(); });\n});\n\nfunction loadDeck(){\n  $('P').value=3000; $('L').value=2000; $('K').value=3.99;\n  $('RINV').value=7; $('RLOAN').value=2; $('PREM').value=700; $('REINV').value=5;\n  $('Q').value=60; $('NLAYER').value=2; $('K2').value=''; $('RP').value=2;\n  syncPremPlaceholder(); calc();\n}\nfunction resetAll(){\n  $('P').value=''; $('L').value=''; $('K').value='';\n  $('RINV').value=7; $('RLOAN').value=2; $('PREM').value=''; $('REINV').value=5;\n  $('Q').value=60; $('NLAYER').value=2; $('K2').value=''; $('RP').value=2;\n  syncPremPlaceholder(); calc();\n}\n\nsyncPremPlaceholder();\ncalc();\n<\/script>\n<\/body>\n<\/html>\n"}];
const stage=document.getElementById('stage'), tabs=document.getElementById('tabs');
const frames={};
TOOLS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.type='button';b.role='tab';b.dataset.k=t.key;b.title=t.full;
  b.innerHTML=`<small>0${i+1}</small>${t.label}`;
  b.onclick=()=>show(t.key);
  tabs.appendChild(b);
});
function show(k){
  const t=TOOLS.find(x=>x.key===k)||TOOLS[0];
  if(!frames[t.key]){const f=document.createElement('iframe');f.title=t.full;f.srcdoc=t.html;stage.appendChild(f);frames[t.key]=f;}
  Object.entries(frames).forEach(([key,f])=>f.classList.toggle('on',key===t.key));
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===t.key));
  document.title=t.full+' · 試算工具合集';
  history.replaceState(null,'','#'+t.key);
  try{localStorage.setItem('tools-tab',t.key)}catch(e){}
}
let start=location.hash.slice(1);
if(!start){try{start=localStorage.getItem('tools-tab')}catch(e){}}
show(start);
</script>
